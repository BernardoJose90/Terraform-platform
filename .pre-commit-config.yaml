# Runs these checks locally on `git commit`, before anything even gets
# pushed. Same checks the CI pipeline runs, just faster — no waiting on a
# push and a pipeline run to find out something's wrong. terraform_fmt is
# the one that matters most here: CI now fails the whole PR on bad
# formatting instead of quietly fixing it, so this hook is what catches
# that before it ever reaches CI.
#
# Install once, per clone:
#   brew install pre-commit terraform-docs   # macOS
#   pre-commit install
#
# Run against everything on demand:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      # Catches a broken workflow YAML file before it costs you a push and a
      # failed run — worth having since every workflow in this repo gets
      # hand-edited a lot.
      - id: check-yaml
        args: [--allow-multiple-documents]
      # A second safety net against accidentally committing a state or plan
      # file — .gitignore is the first one.
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      # The exact same command terraform-apply.yaml's quick-validate step
      # runs. If this passes on your machine, that CI job can't fail.
      - id: terraform_fmt

      # Catches HCL that doesn't parse, or that references something that
      # doesn't exist, without needing real AWS credentials or a backend.
      - id: terraform_validate
        args:
          - --init-args=-backend=false
        exclude: ^modules/ # modules get validated through whatever account calls them

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: '3.3.11'
    hooks:
      - id: checkov
        # Points at the same config file the pipeline uses, so a clean run
        # here and a clean run in CI mean the same thing — one list of
        # accepted findings, one place to update it.
        args:
          - --config-file
          - .checkov.yaml
          - --framework
          - terraform
          - --compact
          - --quiet
        # Only scans member-accounts, matching `directory: member-accounts/`
        # in terraform-plan.yaml. Modules get covered indirectly, through
        # whatever account calls them.
        files: ^member-accounts/.*\.tf$
