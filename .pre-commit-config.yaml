# Runs these checks locally on `git commit`, before anything even gets
# pushed. Same checks the CI pipeline runs, just faster — no waiting on a
# push and a pipeline run to find out something's wrong. terraform_fmt is
# the one that matters most here: CI now fails the whole PR on bad
# formatting instead of quietly fixing it, so this hook is what catches
# that before it ever reaches CI.
#
# Install once, per clone (macOS):
#   brew install pre-commit
#   brew install terraform-linters/tap/tflint   # not in homebrew-core; or grab
#                                               # the binary from GitHub releases
#   pre-commit install
#   tflint --init --config "$(git rev-parse --show-toplevel)/.tflint.hcl"
# (terraform itself is assumed already installed — terraform_fmt/validate use it.)
#
# Run against everything on demand:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      # Catches a broken workflow YAML file before it costs you a push and a
      # failed run — worth having since every workflow in this repo gets
      # hand-edited a lot.
      - id: check-yaml
        args: [--allow-multiple-documents]
      # A second safety net against accidentally committing a state or plan
      # file — .gitignore is the first one. NOTE: this is a SIZE check, not a
      # content check — it catches a big .tfstate, never a 40-char API key.
      # That's what the gitleaks hook below is for.
      - id: check-added-large-files
        args: [--maxkb=500]

  # Scans staged changes for committed credentials (AWS keys, tokens, private
  # keys, webhook URLs, high-entropy strings). Mirrors the Secret Scan CI
  # workflow — a clean run here means a clean run there. `language: golang`,
  # so pre-commit builds the pinned gitleaks itself; no manual install.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      # The exact same command terraform-apply.yaml's quick-validate step
      # runs. If this passes on your machine, that CI job can't fail.
      - id: terraform_fmt

      # Catches HCL that doesn't parse, or that references something that
      # doesn't exist, without needing real AWS credentials or a backend.
      - id: terraform_validate
        args:
          - --init-args=-backend=false
        exclude: ^modules/ # modules get validated through whatever account calls them

      # Same tflint policy the `lint` job in terraform-plan.yaml runs, from
      # the same .tflint.hcl — a clean run here means a clean run in CI.
      # Scoped to member-accounts/ to match that job and the checkov hook
      # below. Needs `tflint --init` run once per clone (see the header).
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
        files: ^member-accounts/.*\.tf$

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: '3.3.11'
    hooks:
      - id: checkov
        # Points at the same config file the pipeline uses, so a clean run
        # here and a clean run in CI mean the same thing — one list of
        # accepted findings, one place to update it.
        args:
          - --config-file
          - .checkov.yaml
          - --framework
          - terraform
          - --compact
          - --quiet
        # Only scans member-accounts, matching `directory: member-accounts/`
        # in terraform-plan.yaml. Modules get covered indirectly, through
        # whatever account calls them.
        files: ^member-accounts/.*\.tf$
