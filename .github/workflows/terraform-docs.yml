name: Terraform Docs Check

# Check-only: fails the job if generated docs would differ from what's
# committed, but never writes or pushes anything itself. Replaces the old
# auto-commit design (terraform-docs bot pushing straight to the branch),
# which deadlocked PRs — a bot commit with "[skip ci]" became the PR's new
# HEAD, and required status checks then waited forever on a report that
# could structurally never arrive. No bot commits means no such deadlock,
# on PRs or on main, so this runs safely on both triggers.
on:
  pull_request:
    branches: [main]
    paths:
      - 'member-accounts/**/*.tf'
      - 'member-accounts/**/*.tfvars'
      - 'modules/**/*.tf'
  push:
    branches: [main]
    paths:
      - 'member-accounts/**/*.tf'
      - 'member-accounts/**/*.tfvars'
      - 'modules/**/*.tf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    name: Check Terraform Docs Are Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover terraform directories
        id: discover
        run: |
          DIRS=$(find member-accounts modules -type f -name '*.tf' \
            -not -path '*/.terraform/*' \
            -exec dirname {} \; | sort -u | paste -sd, -)
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "Found: $DIRS"

      - name: Check generated docs match committed docs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: ${{ steps.discover.outputs.dirs }}
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"
          git-push: "false"

      - name: If this failed
        if: failure()
        run: |
          echo "::error::README.md is out of date. Run 'terraform-docs markdown table --output-file README.md <dir>' locally (or 'terraform-docs' via pre-commit) and commit the result."
