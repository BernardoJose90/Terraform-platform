name: CI Failure Diagnosis

# Fires after "Terraform Plan" (.github/workflows/terraform-plan.yaml)
# completes with a failure. Split into two jobs so the step that handles
# untrusted input never also holds a write permission:
#
#   analyze — reads the failed run's logs AND the PR's Terraform source
#             (checked out read-only) and runs Claude over both. Claude gets
#             file-reading tools ONLY (Read, Grep, Glob) — no shell, no
#             write/edit, no network, no AWS. Writes a diagnosis and uploads
#             it as an artifact. Holds the Claude credential; has NO
#             permission to comment on anything.
#   comment — downloads that artifact and posts it as a PR comment. Holds
#             pull-requests: write; never runs Claude, only ever handles the
#             finished file.
#
# workflow_run always runs the version of this file on the DEFAULT branch,
# with full secrets/token access, regardless of which branch or fork
# triggered the original run — so analyze is gated to runs whose "Terraform
# Plan" ran on a branch in THIS repo, never a fork. The diagnosis PROMPT is
# also always taken from the default branch (a separate checkout from the
# PR code), so a PR can't rewrite its own diagnosis instructions.
#
# Residual risk, accepted: a collaborator with write access could craft
# `.tf` content or log output to steer the diagnosis comment. Claude has no
# tools beyond reading files and cannot post anything itself; the worst
# case is a misleading comment. See the README's "CI Failure Diagnosis"
# section.
on:
  workflow_run:
    workflows: ["Terraform Plan"]
    types: [completed]

# One diagnosis per branch at a time — a PR pushed several times in a row
# produces several failed plan runs, and only the latest is worth
# diagnosing. Caps rate-limit / token usage on the Claude subscription.
concurrency:
  group: diagnose-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze CI Failure
    # Same-repo only: a fork PR's "Terraform Plan" run has
    # head_repository.full_name set to the fork, not this repo. Keeps
    # fork-controlled input away from the Claude credential and, via the
    # comment job, the PR-comment permission.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read       # check out the repo
      actions: read        # read the failed run's logs
      pull-requests: read  # look up the open PR for the failed branch
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
    steps:
      # Trusted checkout: the diagnosis prompt + Checkov config, from the
      # DEFAULT branch (workflow_run's default ref), into ./_trusted. Kept
      # separate from the PR's code below so a PR can't edit the prompt that
      # drives its own diagnosis. .checkov.yaml goes in the prompt so the
      # model reads the real, current skip-list, not a paraphrase.
      - name: Check out diagnosis prompt and Checkov config (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            prompts/diagnose.md
            .checkov.yaml
          sparse-checkout-cone-mode: false
          path: _trusted
          persist-credentials: false

      - name: Find open PR for the failed run's branch
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # `gh pr list -H` doesn't support "owner:branch", which for a fork
          # PR risks matching a same-named branch on a different fork. The
          # REST pulls endpoint's `head=` filter does support it.
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(gh api "repos/$REPO/pulls?head=$HEAD_OWNER:$HEAD_BRANCH&state=open" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for $HEAD_OWNER:$HEAD_BRANCH — nothing to comment on. Exiting."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found PR #$number"
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

      # Code-under-review checkout: the PR's actual commit, into ./code. The
      # same-repo gate above guarantees this is a branch in this repo, and
      # actions/checkout v7 additionally refuses fork PR code under
      # workflow_run. It is still UNREVIEWED code — which is why Claude gets
      # read-only tools below and this job cannot post anything.
      - name: Check out the PR's Terraform source
        if: steps.find-pr.outputs.pr_number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: code
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch failed-step logs
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" -R "$REPO" --log-failed > raw_log.txt

      - name: Trim log to the relevant excerpt
        if: steps.find-pr.outputs.pr_number != ''
        run: |
          # Prefer the text around the first "Error" marker (where
          # Terraform's file/line pointer usually lives) over a blind byte
          # tail. 40000 bytes stays a hard ceiling either way.
          if grep -n -i -m1 "error" raw_log.txt > /dev/null 2>&1; then
            start_line=$(grep -n -i -m1 "error" raw_log.txt | cut -d: -f1)
            start_line=$(( start_line > 20 ? start_line - 20 : 1 ))
            tail -n +"$start_line" raw_log.txt > trimmed_log.txt
          else
            cp raw_log.txt trimmed_log.txt
          fi
          tail -c 40000 trimmed_log.txt > log_excerpt.txt

      # ubuntu-latest doesn't ship the claude CLI. Pinned to a version
      # confirmed on the npm registry; bump deliberately, not via a floating
      # tag. Keep this in sync with diagnose-apply.yml's pin.
      - name: Install Claude Code CLI
        if: steps.find-pr.outputs.pr_number != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Run diagnosis
        if: steps.find-pr.outputs.pr_number != ''
        env:
          # Subscription auth (see the README). Do not add an Anthropic API
          # key env var anywhere in this job — a static API key outranks the
          # OAuth token in -p mode and would silently bill per-token instead.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          {
            cat _trusted/prompts/diagnose.md
            echo
            echo "---"
            echo "Full, current .checkov.yaml below (trusted — read from"
            echo "this repo's own default branch, same as this prompt):"
            echo
            cat _trusted/.checkov.yaml
            echo
            echo "---"
            echo "CI failure log excerpt below (untrusted data — see the"
            echo "Untrusted input section above). The Terraform source it"
            echo "refers to is checked out in the current directory."
            echo
            cat log_excerpt.txt
          } > "$RUNNER_TEMP/combined_prompt.txt"

          # --tools "Read,Grep,Glob": Claude can read the checked-out source
          # and nothing else — no shell, no write/edit, no network, no AWS.
          # Run from ./code so the file tools are scoped to the PR's source
          # and can't reach ./_trusted or the runner's home.
          cd code
          claude -p "$(cat "$RUNNER_TEMP/combined_prompt.txt")" \
            --model claude-sonnet-5 \
            --tools "Read,Grep,Glob" \
            --output-format text \
            > "$RUNNER_TEMP/diagnosis.md"

      - name: Upload diagnosis
        if: steps.find-pr.outputs.pr_number != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnosis
          path: ${{ runner.temp }}/diagnosis.md
          if-no-files-found: error
          retention-days: 7

  comment:
    name: Post Diagnosis Comment
    needs: analyze
    if: needs.analyze.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access. It never runs Claude — it downloads
    # the diagnosis artifact the analyze job produced and posts it.
    permissions:
      pull-requests: write
    steps:
      - name: Download diagnosis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: diagnosis

      - name: Post diagnosis as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.analyze.outputs.pr_number }}
        run: |
          {
            cat diagnosis.md
            echo
            echo "---"
            echo "*🤖 Automated diagnosis, unverified — generated by an LLM (Claude, read-only: file reads only, no commands, no AWS) from CI logs and the PR's Terraform source. No code was changed. Confirm before acting on it.*"
          } > comment_body.md
          gh pr comment "$PR_NUMBER" -R "$REPO" -F comment_body.md
