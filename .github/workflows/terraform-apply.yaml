name: Terraform Apply

# Runs whenever a change lands on main.
# Which accounts, directories, roles, and approval tiers exist is worked
# out at runtime by reading SSM, and only the account folders that
# actually changed get included — adding a new account never means
# editing this workflow.
#
# Wherever possible, this applies the EXACT plan that was reviewed on the
# PR — not a fresh one — so nothing gets applied based on state that may
# have shifted since the review happened.
#
# If that reviewed plan can't be found, what happens depends on how this
# run started:
#
#   1. push to main, production account     -> refuse, fail the run
#   2. push to main, non-production account -> compute a fresh plan
#   3. manual workflow_dispatch run          -> compute a fresh plan
#
# Production has to refuse rather than fall back, because a missing or
# expired artifact, or a failed PR lookup, could otherwise let an
# unreviewed plan slip through and apply — which defeats the whole point
# of reviewing plans in the first place. A manual run is different: a
# person explicitly asked for this apply, so computing a fresh plan for
# them is fine.
#
# To find the reviewed plan, this traces the commit that just landed on
# main back to the PR that produced it. It can't just match github.sha
# directly, because merge, squash, and rebase merges all create a brand
# new commit on main — with a different SHA than the one the PR's
# Terraform plan was actually computed against.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  # Needed for `gh attestation verify` in resolve-plan-run's plan-integrity
  # check (see terraform-plan.yaml's attest-build-provenance step, which is
  # what this verifies against).
  attestations: read

  pull-requests: read

env:
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: "eu-west-2"

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Quick validation before discovery
  # ──────────────────────────────────────────────────────────────────────────────
  quick-validate:
    name: Quick Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Quick Format Check
        run: terraform fmt -check -recursive


  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Detect which account folders changed
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quick-validate
    outputs:
      changed_accounts: ${{ steps.filter.outputs.changed_accounts }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed account folders
        id: filter
        run: |
          # github.event.before is the commit main was sitting on BEFORE this
          # push landed — that's the only correct starting point to diff
          # from for a push event.
          #
          # HEAD~1 (what this used to use) is only correct when the push
          # contains exactly one commit. Rebase-merge a three-commit PR and
          # main gains three commits in one push — HEAD~1 only sees the
          # last of the three, so any account touched by the first two
          # would silently never get applied. That's the exact same kind
          # of silent-partial-deploy problem the "treat everything as
          # changed" rule for modules/ below is also guarding against.
          #
          # The fallbacks below cover: workflow_dispatch (there's no
          # `before` at all), the very first push to a branch (an
          # all-zeroes SHA), and force pushes where `before` points at a
          # commit that no longer exists in history.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable github.event.before; falling back to HEAD~1"
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Diffing $BASE..HEAD"

          # modules/ gets checked first, and separately, from everything
          # else. A shared module has no single account that owns it — any
          # account using it could be affected — and without a real
          # dependency graph mapping which module feeds which account, the
          # only safe answer to "which accounts changed" is "all of them".
          # This is deliberately blunter than the member-accounts/ diff
          # below: a module-only change costs a few extra minutes
          # re-applying every account, which is a much smaller problem than
          # silently never applying to the accounts that actually depend on
          # it — the failure mode this is here to prevent.
          CHANGED_MODULE_FILES=$(git diff --name-only "$BASE" HEAD -- modules/ || echo "")

          if [ -n "$CHANGED_MODULE_FILES" ]; then
            echo "Changed files under modules/:"
            echo "$CHANGED_MODULE_FILES"
            echo "-> treating every discovered account as changed"
            echo "changed_accounts=ALL" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get list of changed files in member-accounts/
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD -- member-accounts/ || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected in member-accounts/ or modules/"
            echo "changed_accounts=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract unique account names from changed paths
          CHANGED_ACCOUNTS=$(echo "$CHANGED_FILES" | \
            grep -E 'member-accounts/[^/]+/' | \
            sed 's|member-accounts/\([^/]*\)/.*|\1|' | \
            sort -u | \
            tr '\n' ',' | \
            sed 's/,$//')

          echo "Changed files: $CHANGED_FILES"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          echo "changed_accounts=$CHANGED_ACCOUNTS" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────────
  # 3. Discover accounts from SSM AND filter by changed accounts
  # ──────────────────────────────────────────────────────────────────────────────
  discover-accounts:
    name: Discover & Filter Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      account_count: ${{ steps.build-matrix.outputs.account_count }}
      # network is split out from everyone else so it can apply in its own
      # job, ahead of every spoke account — see apply-network/apply below.
      network_matrix: ${{ steps.build-matrix.outputs.network_matrix }}
      network_count: ${{ steps.build-matrix.outputs.network_count }}
      other_matrix: ${{ steps.build-matrix.outputs.other_matrix }}
      other_count: ${{ steps.build-matrix.outputs.other_count }}
    steps:
      - name: Configure AWS credentials (discovery role — read-only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DISCOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-discover-accounts
          retry-max-attempts: 3

      - name: Build matrix from SSM AND filter by changed accounts
        id: build-matrix
        run: |
          CHANGED_ACCOUNTS="${{ needs.detect-changes.outputs.changed_accounts }}"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          ACCOUNTS=$(aws ssm get-parameters-by-path \
            --path "/organizations/accounts/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          TIERS=$(aws ssm get-parameters-by-path \
            --path "/organizations/tiers/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          # When $changed is "ALL" (detect-changes sets that when modules/
          # changed), the IN($changed_list[]) filter gets skipped entirely,
          # so every discovered account is included — not just the ones
          # with a direct member-accounts/ change.
          #
          # Note the // "production-approval" default on environment: an
          # account with no tier parameter set in SSM gets the STRICTEST
          # tier, not the loosest. The unreviewed-apply refusal further
          # down keys off exactly that value, so a misconfigured account
          # fails safe rather than sneaking through unreviewed.
          FILTERED=$(jq -c -n --argjson accounts "$ACCOUNTS" --argjson tiers "$TIERS" --arg changed "$CHANGED_ACCOUNTS" '
            ($changed | split(",")) as $changed_list |
            ($tiers | map({(.Name | split("/") | last): .Value}) | add) as $tier_map |
            [
              $accounts[] |
              select(.Name | split("/") | last != "management") |
              select($changed == "ALL" or (.Name | split("/") | last | IN($changed_list[]))) |
              {
                account: (.Name | split("/") | last),
                working_directory: ("member-accounts/" + (.Name | split("/") | last)),
                role_arn: ("arn:aws:iam::" + .Value + ":role/TerraformDeploy"),
                environment: ($tier_map[(.Name | split("/") | last)] // "production-approval"),
                account_id: .Value
              }
            ]')

          MATRIX=$(echo "$FILTERED" | jq -c '{include: .}')
          ACCOUNT_COUNT=$(echo "$FILTERED" | jq 'length')

          # Spoke accounts (production, development, ...) read SSM
          # parameters and assume a role that only exist once network has
          # applied and published them — see the "apply order" comment in
          # member-accounts/network/main.tf. Splitting network out into its
          # own matrix lets the apply-network job finish completely before
          # the apply job (everyone else) even starts, instead of the two
          # racing each other when both land in the same run — which
          # happens whenever a shared modules/ change touches both.
          NETWORK_MATRIX=$(echo "$FILTERED" | jq -c '{include: [.[] | select(.account == "network")]}')
          NETWORK_COUNT=$(echo "$NETWORK_MATRIX" | jq '.include | length')
          OTHER_MATRIX=$(echo "$FILTERED" | jq -c '{include: [.[] | select(.account != "network")]}')
          OTHER_COUNT=$(echo "$OTHER_MATRIX" | jq '.include | length')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "account_count=$ACCOUNT_COUNT" >> "$GITHUB_OUTPUT"
          echo "network_matrix=$NETWORK_MATRIX" >> "$GITHUB_OUTPUT"
          echo "network_count=$NETWORK_COUNT" >> "$GITHUB_OUTPUT"
          echo "other_matrix=$OTHER_MATRIX" >> "$GITHUB_OUTPUT"
          echo "other_count=$OTHER_COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered and filtered accounts: $ACCOUNT_COUNT (network: $NETWORK_COUNT, other: $OTHER_COUNT)"

      - name: No accounts to apply
        if: steps.build-matrix.outputs.account_count == '0'
        run: |
          echo "⚠️ No accounts match the changed files. Skipping apply."

  # ──────────────────────────────────────────────────────────────────────────────
  # 4. Resolve Plan (download reviewed plan if available)
  # ──────────────────────────────────────────────────────────────────────────────
  resolve-plan-run:
    name: Locate and download reviewed plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - discover-accounts
    if: needs.discover-accounts.outputs.account_count != '0' && needs.discover-accounts.outputs.account_count != ''
      # Job-level outputs won't work here, because this is a matrix job —
      # GitHub Actions only keeps whichever matrix instance's output
      # finished last, so there's no safe way to get one output per
      # account out of it.
      #
      # Instead, each apply job below just checks its own account locally.
      # See the "Check reviewed plan actually downloaded" step.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-accounts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This workflow runs on `push` to main, so github.sha is the new
      # merge/squash/rebase commit — it won't match the commit the PR's
      # Terraform plan was actually computed against.
      #
      # So instead, this finds the PR associated with the commit and
      # downloads the plan by PR number instead. Works the same regardless
      # of which merge method was used.
      #
      # If there's no associated PR at all (a manual run, or a direct
      # push), pr_number just comes out empty. The download step below
      # then finds no plan, and the apply jobs fall back to either
      # refusing the apply or computing a fresh plan.
      - name: Resolve PR number for this commit
        id: resolve-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const match = prs.find(p => p.merged_at) || prs[0];
            core.setOutput('pr_number', match ? String(match.number) : '');
            // head_sha is the commit the PR's plan was actually computed
            // against — used below to confirm the downloaded plan really
            // was computed from the code that merged, not from an earlier
            // commit that happened to share the same PR number (see
            // "Verify plan integrity and provenance").
            core.setOutput('head_sha', match ? match.head.sha : '');
            core.info(match
              ? `Commit ${context.sha} -> PR #${match.number} (head ${match.head.sha})`
              : `Commit ${context.sha} has no associated PR (direct push or workflow_dispatch)`);

      - name: Download plan artifact from previous workflow
        id: download
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yaml
          # Only one of pr/commit can be set — the action errors if both
          # are given. pr takes priority when resolve-pr found one;
          # otherwise this falls back to matching the raw SHA directly,
          # which is expected not to find anything.
          pr: ${{ steps.resolve-pr.outputs.pr_number }}
          commit: ${{ steps.resolve-pr.outputs.pr_number == '' && github.sha || '' }}
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}
          if_no_artifact_found: warn

      # Downloading the right artifact by name isn't the same as knowing
      # it's the right artifact. Before this, terraform-apply.yaml downloaded
      # tfplan-<account> and applied it with no check that it was ever
      # computed from the code that actually merged, and no proof it wasn't
      # substituted by anything with artifact-write scope. This step closes
      # both gaps, and discards the plan (rather than failing the job
      # outright) on any failure — a discarded plan just flows into the
      # exact same "Check if plan was found" / "Refuse unreviewed apply"
      # logic below that already handles a plan that was never uploaded at
      # all, so every tier's existing fail-safe behavior (refuse on
      # production, fall back to a fresh plan elsewhere) applies here too,
      # with no new failure mode to reason about.
      - name: Verify plan integrity and provenance
        if: steps.download.outcome == 'success'
        working-directory: ${{ matrix.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ steps.resolve-pr.outputs.head_sha }}
        run: |
          if [ ! -f tfplan.binary ]; then
            exit 0 # nothing downloaded — "Check if plan was found" below handles this
          fi

          if [ ! -f tfplan.sha256 ] || [ ! -f tfplan.sha ]; then
            echo "::warning::${{ matrix.account }}: reviewed plan has no hash/commit stamp (tfplan.sha / tfplan.sha256) — predates the 2026-08-27 integrity fix, or something stripped it. Discarding, not applying it unverified."
            rm -f tfplan.binary tfplan.sha tfplan.sha256
            exit 0
          fi

          if ! sha256sum -c tfplan.sha256; then
            echo "::error::${{ matrix.account }}: reviewed plan failed its own recorded checksum. Discarding it rather than applying something that may have been tampered with, corrupted, or substituted."
            rm -f tfplan.binary tfplan.sha tfplan.sha256
            exit 0
          fi

          PLAN_SHA="$(cat tfplan.sha)"
          if [ -z "$EXPECTED_SHA" ] || [ "$PLAN_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::${{ matrix.account }}: reviewed plan was computed at commit $PLAN_SHA, but the merged PR's actual head is ${EXPECTED_SHA:-unknown}. The reviewed plan does not match the merged code — discarding it rather than applying a stale diff."
            rm -f tfplan.binary tfplan.sha tfplan.sha256
            exit 0
          fi

          if ! gh attestation verify tfplan.binary --repo "$GITHUB_REPOSITORY"; then
            echo "::error::${{ matrix.account }}: reviewed plan has no valid build provenance attestation. Discarding it."
            rm -f tfplan.binary tfplan.sha tfplan.sha256
            exit 0
          fi

          echo "✅ Plan hash, commit stamp, and provenance attestation all verified for ${{ matrix.account }} (commit $PLAN_SHA)."

      - name: Check if plan was found
        id: check
        run: |
          if [ -f "${{ matrix.working_directory }}/tfplan.binary" ]; then
            echo "plan_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found reviewed plan for ${{ matrix.account }}"
            ls -la "${{ matrix.working_directory }}/tfplan.binary"
          else
            echo "plan_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No reviewed (and verified) plan found for ${{ matrix.account }}"
          fi

      # retention-days is 30, raised up from the original 5. Now that a
      # missing artifact is a hard failure on production-tier pushes,
      # rather than quietly falling back to a fresh plan, letting the
      # artifact expire early becomes a real trip hazard — a PR opened
      # right before someone's week off would expire its own plan and end
      # up blocking its own merge. Keep this the same as the two upload
      # steps over in terraform-plan.yaml, which also need to stay at 30.
      #
      # Only tfplan.binary is re-uploaded here, not tfplan.sha/.sha256 —
      # verification already happened once, above, centrally for every
      # account; apply-network and apply below just need the binary itself.
      - name: Upload plan artifact (if found)
        if: steps.check.outputs.plan_exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/tfplan.binary
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # 5. Apply network FIRST. Spoke accounts depend on the SSM parameters and
  #    IAM roles it publishes, so network has to finish before any spoke
  #    account gets started.
  #
  #    This is a plain job, not a matrix, since there's only ever one
  #    network account. A zero-instance matrix would report "success"
  #    instead of "skipped" when there's nothing to do, which would break
  #    the downstream check on needs.apply-network.result — a plain job
  #    with if:false correctly reports "skipped" instead, so that's used
  #    here.
  # ──────────────────────────────────────────────────────────────────────────────
  apply-network:
    name: Terraform Apply - network
    needs:
      - discover-accounts
      - resolve-plan-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.discover-accounts.outputs.network_count == '1'
    environment: ${{ fromJson(needs.discover-accounts.outputs.network_matrix).include[0].environment }}

    concurrency:
      group: tf-apply-network
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (network)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ fromJson(needs.discover-accounts.outputs.network_matrix).include[0].role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-network
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: member-accounts/network
        run: terraform init -input=false

    # needs.resolve-plan-run.outputs.plan_exists isn't usable here.
    # resolve-plan-run is a matrix job, so GitHub only keeps the output
    # from whichever matrix instance happened to finish last — not one
    # output per account. So instead, this always tries downloading the
    # plan and just checks locally whether the file showed up. Same
    # approach resolve-plan-run itself uses, and it correctly reflects
    # whether network's own plan actually exists.
      - name: Download reviewed plan from resolve job
        id: download-reviewed
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-network
          path: member-accounts/network

      - name: Check reviewed plan actually downloaded
        id: reviewed
        working-directory: member-accounts/network
        run: |
          if [ -f tfplan.binary ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Network always gets refused on a push if the reviewed plan is
      # missing — unlike spoke accounts, there's no tier-based exception
      # here. Every spoke depends on network's SSM parameters and IAM
      # roles, so an unreviewed network change could ripple out to affect
      # the whole repo. An unreviewed network plan should never apply
      # automatically on a push.
      - name: Refuse unreviewed apply (network)
        if: steps.reviewed.outputs.found != 'true' && github.event_name == 'push'
        run: |
          echo "::error::No reviewed plan found for network on a push to main."
          echo ""
          echo "This is not a normal condition. It means one of:"
          echo "  - the plan artifact expired (retention is 30 days)"
          echo "  - the artifact download failed or was rate limited"
          echo "  - this commit could not be resolved back to a merged PR"
          echo ""
          echo "Refusing to compute and apply an unreviewed plan to the network"
          echo "account. Open a fresh PR so terraform-plan produces a reviewable"
          echo "plan, or run this workflow via workflow_dispatch if you have"
          echo "deliberately decided a fresh plan is correct."
          exit 1

      - name: Terraform Apply (reviewed plan)
        if: steps.reviewed.outputs.found == 'true'
        working-directory: member-accounts/network
        run: |
          echo "🚀 Applying the exact plan reviewed on the merged PR for network"
          echo "📂 Working directory: member-accounts/network"
          echo ""

          # This retries on two things: IAM eventual consistency
          # (AccessDeniedException) and a resource that AWS accepted but
          # hasn't actually finished settling into yet (IncorrectState —
          # e.g. attaching a VPC to a Transit Gateway that's technically
          # "created" but still short of "available"; modules/tgw now
          # waits for that itself, this is just a backstop for whatever it
          # doesn't cover). Neither of these means AWS state actually
          # changed, so recomputing and reapplying is safe. Not a blind
          # wait — AWS's own SDK reference docs explicitly say
          # AccessDeniedException is non-retryable at the API/provider
          # layer (grouped alongside ValidationException and
          # ResourceNotFoundException), meaning the SDK itself will never
          # retry it automatically. So retrying the whole apply is the
          # only layer left where this can be handled. It costs nothing
          # when there's no race: the vast majority of applies succeed on
          # the first attempt, with no delay at all — unlike a blind fixed
          # time_sleep, which would pause every apply whether or not a
          # race was actually happening.
          #
          # "Saved plan is stale" is deliberately NOT retried here, even
          # though a fresh plan would clear it. It means an earlier
          # attempt in THIS SAME LOOP already partially applied (e.g.
          # destroyed several resources before hitting one AccessDenied)
          # — so the only way to retry is to compute a brand new plan, and
          # that new plan would never have gone through PR review.
          # Auto-applying it would silently defeat the entire "production
          # only applies a reviewed plan" rule this workflow exists to
          # enforce (see the file header). So instead this fails loudly
          # and leaves recovery to a human: check what actually landed in
          # AWS, then get a fresh plan through the normal reviewed path (a
          # new PR, or workflow_dispatch).
          MAX_ATTEMPTS=3
          attempt=1
          while true; do
            echo "--- apply attempt $attempt/$MAX_ATTEMPTS ---"
            # PIPESTATUS[0], not the pipeline's own exit code (which is
            # tee's, always 0), so a real apply failure actually fails this
            # step. Without this, "terraform apply | tee" always reports
            # success no matter what apply did — confirmed on a real run
            # where the log clearly showed "Error: ... Terraform exited
            # with code 1", yet the job still reported "success" via the
            # GitHub API.
            terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt
            EXIT_CODE="${PIPESTATUS[0]}"
            [ "$EXIT_CODE" -eq 0 ] && break

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "❌ Out of retry attempts."
              exit "$EXIT_CODE"
            fi

            if grep -qE "Saved plan is stale" apply_output.txt; then
              echo "::error::Plan went stale mid-apply — an earlier attempt in this run already made partial changes to network. Refusing to auto-replan and apply an unreviewed plan to production. Check the account's actual state in AWS, then get a fresh plan through the normal reviewed path (a new PR, or workflow_dispatch) before continuing."
              exit "$EXIT_CODE"
            fi

            if ! grep -qE "AccessDeniedException|IncorrectState" apply_output.txt; then
              echo "❌ Failure doesn't match a known retryable pattern (IAM propagation, or a resource still settling into its final AWS state) — not retrying."
              exit "$EXIT_CODE"
            fi

            WAIT=$((attempt * 10))
            echo "⏳ Retryable failure detected. Waiting ${WAIT}s, then recomputing and retrying..."
            sleep "$WAIT"
            terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
            attempt=$((attempt + 1))
          done

      # Only reachable through a manual workflow_dispatch run — every push
      # gets blocked above if there's no reviewed plan. A manual run is
      # different because a person explicitly asked for this apply, so
      # computing a fresh plan for them is fine.
      - name: Terraform Apply (fresh plan — fallback)
        if: steps.reviewed.outputs.found != 'true' && github.event_name != 'push'
        working-directory: member-accounts/network
        run: |
          echo "⚠️ No reviewed plan for network. This run is a manual workflow_dispatch,"
          echo "   so a fresh plan is being computed and applied deliberately."
          echo "📂 Working directory: member-accounts/network"
          echo ""
          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary

          # See the "Terraform Apply (reviewed plan)" step above for why
          # this retries specifically on AccessDeniedException / "Saved
          # plan is stale" / IncorrectState, and why it recomputes before
          # every retry (not just this first plan) once this loop has
          # partial progress of its own to worry about.
          MAX_ATTEMPTS=3
          attempt=1
          while true; do
            echo "--- apply attempt $attempt/$MAX_ATTEMPTS ---"
            # PIPESTATUS[0], not the pipeline's own exit code (which is
            # tee's, always 0), so a real apply failure actually fails
            # this step.
            terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt
            EXIT_CODE="${PIPESTATUS[0]}"
            [ "$EXIT_CODE" -eq 0 ] && break

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "❌ Out of retry attempts."
              exit "$EXIT_CODE"
            fi

            if ! grep -qE "AccessDeniedException|Saved plan is stale|IncorrectState" apply_output.txt; then
              echo "❌ Failure doesn't match a known retryable pattern — not retrying."
              exit "$EXIT_CODE"
            fi

            WAIT=$((attempt * 10))
            echo "⏳ Retryable failure detected. Waiting ${WAIT}s, then recomputing and retrying..."
            sleep "$WAIT"
            terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
            attempt=$((attempt + 1))
          done

      - name: Report apply outcome
        working-directory: member-accounts/network
        run: |
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "✅ Apply completed for network"
          echo "─────────────────────────────────────────────────────────────"

          if grep -q "No changes" apply_output.txt; then
            echo "ℹ️ No changes were applied (infrastructure already up to date)"
          else
            echo "📝 Changes applied successfully"
          fi

      - name: Apply Success Notification
        if: success()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ SUCCESS: network"
          echo "════════════════════════════════════════════════════════════"

      - name: Apply Failure Notification
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "❌ FAILED: network"
          echo "════════════════════════════════════════════════════════════"

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apply-network
          path: member-accounts/network/apply_output.txt
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────────
  # 6. Apply every other changed account, after network finishes. This is
  #    what stops spoke accounts from racing network.
  #
  #    !failure() && !cancelled() reads as "continue, unless an upstream
  #    job actually failed or got cancelled" — which also lets this job
  #    continue normally when network was simply skipped because it wasn't
  #    needed. If network WAS needed and it failed, every other account's
  #    apply gets skipped too, so nothing applies against an incomplete or
  #    broken network state.
  # ──────────────────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply - ${{ matrix.account }}
    needs:
      - discover-accounts
      - resolve-plan-run
      - apply-network
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.discover-accounts.outputs.other_count != '0' && needs.discover-accounts.outputs.other_count != '' && !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover-accounts.outputs.other_matrix) }}

    environment: ${{ matrix.environment }}

    concurrency:
      group: tf-apply-${{ matrix.account }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (${{ matrix.account }})
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ matrix.account }}
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false

      # needs.resolve-plan-run.outputs.plan_exists isn't usable here either
      # — resolve-plan-run is a matrix job, so GitHub only keeps the output
      # from whichever matrix instance finished last, not one value per
      # account. Reading it here would mean every account sees the same,
      # possibly wrong, value. So instead each account downloads its own
      # plan and checks locally whether the file is actually there — the
      # only reliable way for an account to confirm its own reviewed plan
      # exists.
      - name: Download reviewed plan from resolve job
        id: download-reviewed
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}

      - name: Check reviewed plan actually downloaded
        id: reviewed
        working-directory: ${{ matrix.working_directory }}
        run: |
          if [ -f tfplan.binary ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The tier comes straight from matrix.environment. If an account has
      # no tier set in SSM, discover-accounts already defaulted it to
      # "production-approval" — so a new or misconfigured account gets
      # treated as production here too, and gets refused if its reviewed
      # plan is missing, rather than quietly falling back to a fresh plan.
      # That's the fail-safe behavior.
      - name: Refuse unreviewed apply (${{ matrix.account }})
        if: steps.reviewed.outputs.found != 'true' && github.event_name == 'push' && matrix.environment == 'production-approval'
        run: |
          echo "::error::No reviewed plan found for ${{ matrix.account }} on a push to main."
          echo ""
          echo "This is not a normal condition. It means one of:"
          echo "  - the plan artifact expired (retention is 30 days)"
          echo "  - the artifact download failed or was rate limited"
          echo "  - this commit could not be resolved back to a merged PR"
          echo ""
          echo "Refusing to compute and apply an unreviewed plan to a"
          echo "production-tier account. Open a fresh PR so terraform-plan"
          echo "produces a reviewable plan, or run this workflow via"
          echo "workflow_dispatch if a fresh plan is what you actually want."
          exit 1

      - name: Terraform Apply (reviewed plan)
        if: steps.reviewed.outputs.found == 'true'
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "🚀 Applying the exact plan reviewed on the merged PR for ${{ matrix.account }} (ID: ${{ matrix.account_id }})"
          echo "📂 Working directory: ${{ matrix.working_directory }}"
          echo "🏷️ Environment: ${{ matrix.environment }}"
          echo ""

          # This retries on two things: IAM eventual consistency
          # (AccessDeniedException) and a resource that AWS accepted but
          # hasn't actually finished settling into yet (IncorrectState —
          # e.g. attaching a VPC to a Transit Gateway that's technically
          # "created" but still short of "available"; modules/tgw now
          # waits for that itself, this is just a backstop for whatever it
          # doesn't cover). Neither of these means AWS state actually
          # changed, so recomputing and reapplying is safe. Not a blind
          # wait — AWS's own SDK reference docs explicitly say
          # AccessDeniedException is non-retryable at the API/provider
          # layer (grouped alongside ValidationException and
          # ResourceNotFoundException), meaning the SDK itself will never
          # retry it automatically. So retrying the whole apply is the
          # only layer left where this can be handled. It costs nothing
          # when there's no race: the vast majority of applies succeed on
          # the first attempt, with no delay at all — unlike a blind fixed
          # time_sleep, which would pause every apply whether or not a
          # race was actually happening.
          #
          # "Saved plan is stale" is deliberately NOT retried here, even
          # though a fresh plan would clear it. It means an earlier
          # attempt in THIS SAME LOOP already partially applied (e.g.
          # destroyed several resources before hitting one AccessDenied)
          # — so the only way to retry is to compute a brand new plan, and
          # that new plan would never have gone through PR review.
          # Auto-applying it would silently defeat the entire "production
          # only applies a reviewed plan" rule this workflow exists to
          # enforce (see the file header). So instead this fails loudly
          # and leaves recovery to a human: check what actually landed in
          # AWS, then get a fresh plan through the normal reviewed path (a
          # new PR, or workflow_dispatch).
          MAX_ATTEMPTS=3
          attempt=1
          while true; do
            echo "--- apply attempt $attempt/$MAX_ATTEMPTS ---"
            # PIPESTATUS[0], not the pipeline's own exit code (which is
            # tee's, always 0), so a real apply failure actually fails this
            # step. Without this, "terraform apply | tee" always reports
            # success no matter what apply did — confirmed on a real run
            # where the log clearly showed "Error: ... Terraform exited
            # with code 1", yet the job still reported "success" via the
            # GitHub API.
            terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt
            EXIT_CODE="${PIPESTATUS[0]}"
            [ "$EXIT_CODE" -eq 0 ] && break

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "❌ Out of retry attempts."
              exit "$EXIT_CODE"
            fi

            if grep -qE "Saved plan is stale" apply_output.txt; then
              echo "::error::Plan went stale mid-apply — an earlier attempt in this run already made partial changes to ${{ matrix.account }}. Refusing to auto-replan and apply an unreviewed plan to production. Check the account's actual state in AWS, then get a fresh plan through the normal reviewed path (a new PR, or workflow_dispatch) before continuing."
              exit "$EXIT_CODE"
            fi

            if ! grep -qE "AccessDeniedException|IncorrectState" apply_output.txt; then
              echo "❌ Failure doesn't match a known retryable pattern (IAM propagation, or a resource still settling into its final AWS state) — not retrying."
              exit "$EXIT_CODE"
            fi

            WAIT=$((attempt * 10))
            echo "⏳ Retryable failure detected. Waiting ${WAIT}s, then recomputing and retrying..."
            sleep "$WAIT"
            terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
            attempt=$((attempt + 1))
          done

      # Runs for manual workflow_dispatch runs, or for non-production
      # accounts on a push. Production pushes get blocked by the refusal
      # step above instead.
      - name: Terraform Apply (fresh plan — fallback)
        if: steps.reviewed.outputs.found != 'true' && !(github.event_name == 'push' && matrix.environment == 'production-approval')
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "⚠️ No reviewed plan for ${{ matrix.account }} (tier: ${{ matrix.environment }})."
          echo "🚀 Computing a fresh plan and applying it — permitted for this tier/event."
          echo "📂 Working directory: ${{ matrix.working_directory }}"
          echo ""
          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary

          # See the "Terraform Apply (reviewed plan)" step above for why
          # this retries specifically on AccessDeniedException / "Saved
          # plan is stale" / IncorrectState, and why it recomputes before
          # every retry (not just this first plan) once this loop has
          # partial progress of its own to worry about.
          MAX_ATTEMPTS=3
          attempt=1
          while true; do
            echo "--- apply attempt $attempt/$MAX_ATTEMPTS ---"
            # PIPESTATUS[0], not the pipeline's own exit code (which is
            # tee's, always 0), so a real apply failure actually fails
            # this step.
            terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt
            EXIT_CODE="${PIPESTATUS[0]}"
            [ "$EXIT_CODE" -eq 0 ] && break

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "❌ Out of retry attempts."
              exit "$EXIT_CODE"
            fi

            if ! grep -qE "AccessDeniedException|Saved plan is stale|IncorrectState" apply_output.txt; then
              echo "❌ Failure doesn't match a known retryable pattern — not retrying."
              exit "$EXIT_CODE"
            fi

            WAIT=$((attempt * 10))
            echo "⏳ Retryable failure detected. Waiting ${WAIT}s, then recomputing and retrying..."
            sleep "$WAIT"
            terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
            attempt=$((attempt + 1))
          done

      - name: Report apply outcome
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "✅ Apply completed for ${{ matrix.account }}"
          echo "─────────────────────────────────────────────────────────────"

          if grep -q "No changes" apply_output.txt; then
            echo "ℹ️ No changes were applied (infrastructure already up to date)"
          else
            echo "📝 Changes applied successfully"
          fi

      - name: Apply Success Notification
        if: success()
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ SUCCESS: ${{ matrix.account }}"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "📋 Summary:"
          echo "  Account: ${{ matrix.account }}"
          echo "  Account ID: ${{ matrix.account_id }}"
          echo "  Environment: ${{ matrix.environment }}"
          echo "  Region: ${{ env.AWS_REGION }}"

      - name: Apply Failure Notification
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "❌ FAILED: ${{ matrix.account }}"
          echo "════════════════════════════════════════════════════════════"

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apply-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/apply_output.txt
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────────
  # 7. Summary
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Apply Summary
    needs:
      - discover-accounts
      - apply-network
      - apply
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "🚀 APPLY SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "Accounts applied: ${{ needs.discover-accounts.outputs.account_count }}"
          echo ""
          # This guard is needed because a push that passes paths-ignore
          # but doesn't actually touch member-accounts/ or modules/ (say,
          # it only touched scripts/, assets/, or a root file) leaves
          # has_changes false. That means discover-accounts gets skipped,
          # and this output comes through as an empty string. Piping ""
          # straight into jq exits non-zero — which used to turn this
          # entire run red and email everyone about a push that had
          # correctly done nothing at all.
          MATRIX='${{ needs.discover-accounts.outputs.matrix }}'
          if [ -n "$MATRIX" ]; then
            echo "Matrix:"
            echo "$MATRIX" | jq '.include[] | {account: .account, environment: .environment}'
          else
            echo "No apply matrix (nothing under member-accounts/ or modules/ changed)."
          fi
          echo ""
          echo "apply-network: ${{ needs.apply-network.result }}"
          echo "apply:         ${{ needs.apply.result }}"

      # Without this step, the summary job would always show green,
      # making it useless as a required status check. Only a real
      # "failure" here blocks anything — "skipped" is a perfectly normal
      # outcome and shouldn't count against it.
      - name: Fail if any apply failed
        run: |
          if [ "${{ needs.apply-network.result }}" = "failure" ] || [ "${{ needs.apply.result }}" = "failure" ]; then
            echo "❌ At least one account failed to apply."
            exit 1
          fi
          echo "✅ Every account that needed an apply completed."