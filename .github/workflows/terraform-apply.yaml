name: Terraform Apply

# Runs on merge to main. The account list, working directory, deploy role,
# and approval tier are all discovered at runtime from the SSM account
# manifest AND filtered by which account folders actually changed.
# Adding a new account never requires editing this file.
#
# Where possible, this workflow applies the EXACT plan that was reviewed on
# the merged pull request (produced by terraform-plan.yaml), rather than
# recomputing a new plan at apply time. This closes the gap where a
# reviewer approves one plan but a different one — computed against
# possibly-drifted state — is what actually gets applied. If no matching
# reviewed plan can be found (e.g. workflow_dispatch, or a direct push to
# main without a PR), it falls back to computing a fresh plan and applying
# that.
#
# Finding that reviewed plan means resolving THIS push's commit (a brand
# new merge/squash/rebase commit, per whichever merge method was used) back
# to the PR whose terraform-plan.yaml run actually produced the artifact —
# see resolve-plan-run below. A direct SHA match never works: none of
# GitHub's three merge methods produce a commit on main whose SHA equals
# the one the PR's plan run actually ran against.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  # Needed by resolve-plan-run's PR lookup (listPullRequestsAssociatedWithCommit),
  # which resolves this push's merge/squash/rebase commit back to the PR whose
  # plan run actually has the artifact — see that job for why.
  pull-requests: read

env:
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: "eu-west-2"

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Quick validation before discovery
  # ──────────────────────────────────────────────────────────────────────────────
  quick-validate:
    name: Quick Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Quick Format Check
        run: terraform fmt -check -recursive

  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Security Scan (Checkov) - Commented out
  # ──────────────────────────────────────────────────────────────────────────────
  # security-scan:
  #   name: Security Scan (Checkov)
  #   runs-on: ubuntu-latest
  #   ...

  # ──────────────────────────────────────────────────────────────────────────────
  # 3. Detect which account folders changed
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quick-validate
    outputs:
      changed_accounts: ${{ steps.filter.outputs.changed_accounts }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed account folders
        id: filter
        run: |
          # modules/ is checked FIRST and separately. A shared module has no
          # single owning account, and any account that consumes it can be
          # affected — without a dependency graph mapping module -> accounts,
          # the only safe answer to "which accounts" is "all of them". This
          # is deliberately blunter than the member-accounts/ diff below: a
          # module-only change costs a few extra minutes re-applying every
          # account, versus silently never applying to the accounts that
          # actually depend on it (the failure mode this replaces).
          CHANGED_MODULE_FILES=$(git diff --name-only HEAD~1 HEAD -- modules/ || echo "")

          if [ -n "$CHANGED_MODULE_FILES" ]; then
            echo "Changed files under modules/:"
            echo "$CHANGED_MODULE_FILES"
            echo "-> treating every discovered account as changed"
            echo "changed_accounts=ALL" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get list of changed files in member-accounts/
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- member-accounts/ || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected in member-accounts/ or modules/"
            echo "changed_accounts=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract unique account names from changed paths
          CHANGED_ACCOUNTS=$(echo "$CHANGED_FILES" | \
            grep -E 'member-accounts/[^/]+/' | \
            sed 's|member-accounts/\([^/]*\)/.*|\1|' | \
            sort -u | \
            tr '\n' ',' | \
            sed 's/,$//')

          echo "Changed files: $CHANGED_FILES"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          echo "changed_accounts=$CHANGED_ACCOUNTS" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────────
  # 4. Discover accounts from SSM AND filter by changed accounts
  # ──────────────────────────────────────────────────────────────────────────────
  discover-accounts:
    name: Discover & Filter Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      account_count: ${{ steps.build-matrix.outputs.account_count }}
      # network is split out from everyone else so it can apply in its own
      # job, ahead of every spoke account — see apply-network/apply below.
      network_matrix: ${{ steps.build-matrix.outputs.network_matrix }}
      network_count: ${{ steps.build-matrix.outputs.network_count }}
      other_matrix: ${{ steps.build-matrix.outputs.other_matrix }}
      other_count: ${{ steps.build-matrix.outputs.other_count }}
    steps:
      - name: Configure AWS credentials (discovery role — read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DISCOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-discover-accounts
          retry-max-attempts: 3

      - name: Build matrix from SSM AND filter by changed accounts
        id: build-matrix
        run: |
          CHANGED_ACCOUNTS="${{ needs.detect-changes.outputs.changed_accounts }}"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          ACCOUNTS=$(aws ssm get-parameters-by-path \
            --path "/organizations/accounts/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          TIERS=$(aws ssm get-parameters-by-path \
            --path "/organizations/tiers/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          # $changed == "ALL" (set by detect-changes when modules/ changed)
          # bypasses the IN($changed_list[]) filter entirely, so every
          # discovered account is included instead of just the ones with a
          # direct member-accounts/ change.
          FILTERED=$(jq -c -n --argjson accounts "$ACCOUNTS" --argjson tiers "$TIERS" --arg changed "$CHANGED_ACCOUNTS" '
            ($changed | split(",")) as $changed_list |
            ($tiers | map({(.Name | split("/") | last): .Value}) | add) as $tier_map |
            [
              $accounts[] |
              select(.Name | split("/") | last != "management") |
              select($changed == "ALL" or (.Name | split("/") | last | IN($changed_list[]))) |
              {
                account: (.Name | split("/") | last),
                working_directory: ("member-accounts/" + (.Name | split("/") | last)),
                role_arn: ("arn:aws:iam::" + .Value + ":role/TerraformDeploy"),
                environment: ($tier_map[(.Name | split("/") | last)] // "production-approval"),
                account_id: .Value
              }
            ]')

          MATRIX=$(echo "$FILTERED" | jq -c '{include: .}')
          ACCOUNT_COUNT=$(echo "$FILTERED" | jq 'length')

          # Spoke accounts (production, development, ...) read SSM parameters
          # and assume a role that only exist once network has applied and
          # published them — see member-accounts/network/main.tf's own
          # "apply order" comment. Splitting network into its own matrix
          # lets apply-network run to completion before apply (everyone
          # else) starts, instead of racing it when both land in the same
          # workflow run (e.g. a shared modules/ change touches both).
          NETWORK_MATRIX=$(echo "$FILTERED" | jq -c '{include: [.[] | select(.account == "network")]}')
          NETWORK_COUNT=$(echo "$NETWORK_MATRIX" | jq '.include | length')
          OTHER_MATRIX=$(echo "$FILTERED" | jq -c '{include: [.[] | select(.account != "network")]}')
          OTHER_COUNT=$(echo "$OTHER_MATRIX" | jq '.include | length')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "account_count=$ACCOUNT_COUNT" >> "$GITHUB_OUTPUT"
          echo "network_matrix=$NETWORK_MATRIX" >> "$GITHUB_OUTPUT"
          echo "network_count=$NETWORK_COUNT" >> "$GITHUB_OUTPUT"
          echo "other_matrix=$OTHER_MATRIX" >> "$GITHUB_OUTPUT"
          echo "other_count=$OTHER_COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered and filtered accounts: $ACCOUNT_COUNT (network: $NETWORK_COUNT, other: $OTHER_COUNT)"

      - name: No accounts to apply
        if: steps.build-matrix.outputs.account_count == '0'
        run: |
          echo "⚠️ No accounts match the changed files. Skipping apply."

  # ──────────────────────────────────────────────────────────────────────────────
  # 5. Resolve Plan (download reviewed plan if available)
  # ──────────────────────────────────────────────────────────────────────────────
  resolve-plan-run:
    name: Locate and download reviewed plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - discover-accounts
    if: needs.discover-accounts.outputs.account_count != '0' && needs.discover-accounts.outputs.account_count != ''
    # No job-level `outputs:` here on purpose: this is a matrix job, and
    # GitHub Actions collapses a matrix job's outputs to whichever instance
    # finished last, not one value per account. The apply jobs re-check
    # locally per account instead of trusting an output from here — see
    # their "Check reviewed plan actually downloaded" step.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-accounts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      # A direct commit-SHA match against github.sha never works here: this
      # workflow runs on `push` to main, where github.sha is a brand-new
      # merge/squash/rebase commit that never equals the SHA terraform-plan.yaml
      # actually ran against (the PR branch's own head commit). Resolving the
      # associated PR first, and downloading by PR number instead, is what
      # makes this correct for all three of GitHub's merge methods — the
      # download step below then uses the PR's head SHA internally.
      #
      # A commit with no associated PR (workflow_dispatch, a direct push) is
      # expected and fine: pr_number comes back empty, and the download step's
      # own commit: fallback below correctly finds nothing, so the workflow
      # falls through to computing a fresh plan as designed.
      - name: Resolve PR number for this commit
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const match = prs.find(p => p.merged_at) || prs[0];
            core.setOutput('pr_number', match ? String(match.number) : '');
            core.info(match
              ? `Commit ${context.sha} -> PR #${match.number}`
              : `Commit ${context.sha} has no associated PR (direct push or workflow_dispatch)`);

      - name: Download plan artifact from previous workflow
        id: download
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yaml
          # Exactly one of pr/commit may be set (the action errors if both
          # are) — pr wins when resolve-pr found one, otherwise this falls
          # back to the (expected-to-miss) direct SHA match.
          pr: ${{ steps.resolve-pr.outputs.pr_number }}
          commit: ${{ steps.resolve-pr.outputs.pr_number == '' && github.sha || '' }}
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}
          if_no_artifact_found: warn

      - name: Check if plan was found
        id: check
        run: |
          if [ -f "${{ matrix.working_directory }}/tfplan.binary" ]; then
            echo "plan_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found reviewed plan for ${{ matrix.account }}"
            ls -la "${{ matrix.working_directory }}/tfplan.binary"
          else
            echo "plan_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No reviewed plan found for ${{ matrix.account }} — will use fresh plan"
          fi

      - name: Upload plan artifact (if found)
        if: steps.check.outputs.plan_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/tfplan.binary
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────────────
  # 6a. Apply network FIRST, alone — spoke accounts (production, development,
  #     ...) read SSM parameters and assume a role that only exist once
  #     network has applied and published them (see network/main.tf's own
  #     "apply order" comment). Without this split, a shared modules/ change
  #     that puts network and a spoke in the SAME run's matrix would let
  #     GitHub Actions run them concurrently (matrix instances have no
  #     inherent ordering) and race — spoke's apply hitting network state
  #     that isn't there yet.
  #
  # Deliberately NOT a matrix job, unlike apply below — network_count is
  # always exactly 0 or 1 (there's only ever one "network" account), so a
  # plain if:-gated job is enough. This was a matrix job originally, gated
  # on a zero-or-one-element network_matrix, and it broke apply in
  # production: the downstream job's if: read needs.apply-network.result
  # expecting 'skipped' when network wasn't in the run, but a matrix job
  # with zero generated instances doesn't behave like a normal skipped job
  # — verified locally with act, a zero-instance matrix job reported
  # result 'success' with none of its steps ever running, which is not
  # what either the original code or a plain if:false job produces. A
  # plain (non-matrix) job's if:false reliably reports 'skipped' — this is
  # the well-documented, low-risk case, confirmed with the same local
  # test — so apply-network no longer uses strategy.matrix at all.
  # ──────────────────────────────────────────────────────────────────────────────
  apply-network:
    name: Terraform Apply - network
    needs:
      - discover-accounts
      - resolve-plan-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.discover-accounts.outputs.network_count == '1'
    environment: ${{ fromJson(needs.discover-accounts.outputs.network_matrix).include[0].environment }}

    concurrency:
      group: tf-apply-network
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (network)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ fromJson(needs.discover-accounts.outputs.network_matrix).include[0].role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-network
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: member-accounts/network
        run: terraform init -input=false

      # needs.resolve-plan-run.outputs.plan_exists is NOT usable here:
      # resolve-plan-run is itself a matrix job, and GitHub Actions collapses
      # a matrix job's outputs to whichever instance happened to finish
      # last — not one value per account. Downloading unconditionally and
      # checking the file locally, exactly like resolve-plan-run itself
      # does, is the only correct way to know about network's own plan.
      - name: Download reviewed plan from resolve job
        id: download-reviewed
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tfplan-network
          path: member-accounts/network

      - name: Check reviewed plan actually downloaded
        id: reviewed
        working-directory: member-accounts/network
        run: |
          if [ -f tfplan.binary ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply (reviewed plan)
        if: steps.reviewed.outputs.found == 'true'
        working-directory: member-accounts/network
        run: |
          echo "🚀 Applying the exact plan reviewed on the merged PR for network"
          echo "📂 Working directory: member-accounts/network"
          echo ""
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      - name: Terraform Apply (fresh plan — fallback)
        if: steps.reviewed.outputs.found != 'true'
        working-directory: member-accounts/network
        run: |
          echo "⚠️ No reviewed plan found for network (this run wasn't triggered by a merged PR)."
          echo "🚀 Computing a fresh plan and applying it for network"
          echo "📂 Working directory: member-accounts/network"
          echo ""
          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      - name: Report apply outcome
        working-directory: member-accounts/network
        run: |
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "✅ Apply completed for network"
          echo "─────────────────────────────────────────────────────────────"

          if grep -q "No changes" apply_output.txt; then
            echo "ℹ️ No changes were applied (infrastructure already up to date)"
          else
            echo "📝 Changes applied successfully"
          fi

      - name: Apply Success Notification
        if: success()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ SUCCESS: network"
          echo "════════════════════════════════════════════════════════════"

      - name: Apply Failure Notification
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "❌ FAILED: network"
          echo "════════════════════════════════════════════════════════════"

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-network
          path: member-accounts/network/apply_output.txt
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # 6b. Apply every other changed account. Waits on apply-network so it never
  #     races network. !failure() && !cancelled() (rather than string-
  #     matching needs.apply-network.result) is what GitHub's own docs
  #     recommend for "proceed unless something upstream actually failed" —
  #     verified locally with act: it correctly proceeds after an upstream
  #     job skips itself (if:false) and correctly blocks after an upstream
  #     job genuinely fails, without needing to know result's exact string
  #     value either way. If network WAS in this run and failed, every
  #     other account's apply is skipped too, rather than applying against
  #     a network state known to be broken/incomplete.
  # ──────────────────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply - ${{ matrix.account }}
    needs:
      - discover-accounts
      - resolve-plan-run
      - apply-network
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.discover-accounts.outputs.other_count != '0' && needs.discover-accounts.outputs.other_count != '' && !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover-accounts.outputs.other_matrix) }}

    environment: ${{ matrix.environment }}

    concurrency:
      group: tf-apply-${{ matrix.account }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (${{ matrix.account }})
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ matrix.account }}
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false

      # needs.resolve-plan-run.outputs.plan_exists is NOT usable here:
      # resolve-plan-run is itself a matrix job, and GitHub Actions collapses
      # a matrix job's outputs to whichever instance happened to finish
      # last — not one value per account. Every account in THIS matrix would
      # end up reading the same (usually wrong) shared value instead of its
      # own. Downloading unconditionally and checking the file locally,
      # exactly like resolve-plan-run itself does, is the only correct way
      # for each account to know about its own reviewed plan.
      - name: Download reviewed plan from resolve job
        id: download-reviewed
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}

      - name: Check reviewed plan actually downloaded
        id: reviewed
        working-directory: ${{ matrix.working_directory }}
        run: |
          if [ -f tfplan.binary ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply (reviewed plan)
        if: steps.reviewed.outputs.found == 'true'
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "🚀 Applying the exact plan reviewed on the merged PR for ${{ matrix.account }} (ID: ${{ matrix.account_id }})"
          echo "📂 Working directory: ${{ matrix.working_directory }}"
          echo "🏷️ Environment: ${{ matrix.environment }}"
          echo ""
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      - name: Terraform Apply (fresh plan — fallback)
        if: steps.reviewed.outputs.found != 'true'
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "⚠️ No reviewed plan found for ${{ matrix.account }} (this run wasn't triggered by a merged PR)."
          echo "🚀 Computing a fresh plan and applying it for ${{ matrix.account }} (ID: ${{ matrix.account_id }})"
          echo "📂 Working directory: ${{ matrix.working_directory }}"
          echo "🏷️ Environment: ${{ matrix.environment }}"
          echo ""
          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      - name: Report apply outcome
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "✅ Apply completed for ${{ matrix.account }}"
          echo "─────────────────────────────────────────────────────────────"

          if grep -q "No changes" apply_output.txt; then
            echo "ℹ️ No changes were applied (infrastructure already up to date)"
          else
            echo "📝 Changes applied successfully"
          fi

      - name: Apply Success Notification
        if: success()
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ SUCCESS: ${{ matrix.account }}"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "📋 Summary:"
          echo "  Account: ${{ matrix.account }}"
          echo "  Account ID: ${{ matrix.account_id }}"
          echo "  Environment: ${{ matrix.environment }}"
          echo "  Region: ${{ env.AWS_REGION }}"


      - name: Apply Failure Notification
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "❌ FAILED: ${{ matrix.account }}"
          echo "════════════════════════════════════════════════════════════"

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/apply_output.txt
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # 7. Summary
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Apply Summary
    needs:
      - discover-accounts
      - apply-network
      - apply
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "🚀 APPLY SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "Accounts applied: ${{ needs.discover-accounts.outputs.account_count }}"
          echo ""
          echo "Matrix:"
          echo '${{ needs.discover-accounts.outputs.matrix }}' | jq '.include[] | {account: .account, environment: .environment}'