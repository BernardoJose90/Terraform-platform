name: Terraform Apply

# Runs when changes are merged to main.
# Accounts, directories, roles, and approval tiers are discovered at runtime
# from SSM and only changed account folders are included.
# Adding a new account does not require changing this workflow.
#
# When possible, apply the EXACT Terraform plan that was reviewed in the PR.
# This prevents applying a different plan based on state that may have changed
# since the review.
#
# If the reviewed plan cannot be found:
#
#   1-push to main + production -> REFUSE and fail
#   2-push to main + non-production -> create a fresh plan
#   3-workflow_dispatch -> create a fresh plan
#
# Production must refuse when the reviewed plan is missing. Otherwise, a
# missing/expired artifact or failed PR lookup could cause an unreviewed plan
# to be applied, defeating the purpose of reviewed plans.
#
# Manual runs are different because someone explicitly requested the apply,
# so creating a fresh plan is acceptable.
#
# To find the reviewed plan, we trace the current main commit back to the PR
# that produced the plan artifact. We cannot match github.sha directly because
# merge, squash, and rebase merges create a new commit on main with a different
# SHA from the commit used by the PR's Terraform plan.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

  pull-requests: read

env:
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: "eu-west-2"

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Quick validation before discovery
  # ──────────────────────────────────────────────────────────────────────────────
  quick-validate:
    name: Quick Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Quick Format Check
        run: terraform fmt -check -recursive


  # ──────────────────────────────────────────────────────────────────────────────
  # 3. Detect which account folders changed
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quick-validate
    outputs:
      changed_accounts: ${{ steps.filter.outputs.changed_accounts }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed account folders
        id: filter
        run: |
          # github.event.before is the commit main was on BEFORE this push,
          # which is the only correct base for a push event.
          #
          # HEAD~1 (what this used to be) is only right when the push contains
          # exactly one commit. Rebase-merge a three-commit PR and main gains
          # three commits in a single push: HEAD~1 sees only the last one, so
          # any account touched by the first two is silently never applied.
          # That is the same class of silent-partial-deploy failure the
          # modules/ "treat everything as changed" rule below exists to avoid.
          #
          # The fallbacks cover workflow_dispatch (no `before`), the first push
          # to a branch (all-zeroes SHA), and force pushes where `before` no
          # longer exists in history.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable github.event.before; falling back to HEAD~1"
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Diffing $BASE..HEAD"

          # modules/ is checked FIRST and separately. A shared module has no
          # single owning account, and any account that consumes it can be
          # affected — without a dependency graph mapping module -> accounts,
          # the only safe answer to "which accounts" is "all of them". This
          # is deliberately blunter than the member-accounts/ diff below: a
          # module-only change costs a few extra minutes re-applying every
          # account, versus silently never applying to the accounts that
          # actually depend on it (the failure mode this replaces).
          CHANGED_MODULE_FILES=$(git diff --name-only "$BASE" HEAD -- modules/ || echo "")

          if [ -n "$CHANGED_MODULE_FILES" ]; then
            echo "Changed files under modules/:"
            echo "$CHANGED_MODULE_FILES"
            echo "-> treating every discovered account as changed"
            echo "changed_accounts=ALL" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get list of changed files in member-accounts/
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD -- member-accounts/ || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected in member-accounts/ or modules/"
            echo "changed_accounts=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract unique account names from changed paths
          CHANGED_ACCOUNTS=$(echo "$CHANGED_FILES" | \
            grep -E 'member-accounts/[^/]+/' | \
            sed 's|member-accounts/\([^/]*\)/.*|\1|' | \
            sort -u | \
            tr '\n' ',' | \
            sed 's/,$//')

          echo "Changed files: $CHANGED_FILES"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          echo "changed_accounts=$CHANGED_ACCOUNTS" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────────
  # 4. Discover accounts from SSM AND filter by changed accounts
  # ──────────────────────────────────────────────────────────────────────────────
  discover-accounts:
    name: Discover & Filter Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      account_count: ${{ steps.build-matrix.outputs.account_count }}
      # network is split out from everyone else so it can apply in its own
      # job, ahead of every spoke account — see apply-network/apply below.
      network_matrix: ${{ steps.build-matrix.outputs.network_matrix }}
      network_count: ${{ steps.build-matrix.outputs.network_count }}
      other_matrix: ${{ steps.build-matrix.outputs.other_matrix }}
      other_count: ${{ steps.build-matrix.outputs.other_count }}
    steps:
      - name: Configure AWS credentials (discovery role — read-only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DISCOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-discover-accounts
          retry-max-attempts: 3

      - name: Build matrix from SSM AND filter by changed accounts
        id: build-matrix
        run: |
          CHANGED_ACCOUNTS="${{ needs.detect-changes.outputs.changed_accounts }}"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          ACCOUNTS=$(aws ssm get-parameters-by-path \
            --path "/organizations/accounts/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          TIERS=$(aws ssm get-parameters-by-path \
            --path "/organizations/tiers/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          # $changed == "ALL" (set by detect-changes when modules/ changed)
          # bypasses the IN($changed_list[]) filter entirely, so every
          # discovered account is included instead of just the ones with a
          # direct member-accounts/ change.
          #
          # Note the // "production-approval" default on environment: an
          # account with no tier parameter in SSM gets the STRICTEST tier, not
          # the loosest. The unreviewed-apply refusal below keys off exactly
          # that value, so a misconfigured account fails safe.
          FILTERED=$(jq -c -n --argjson accounts "$ACCOUNTS" --argjson tiers "$TIERS" --arg changed "$CHANGED_ACCOUNTS" '
            ($changed | split(",")) as $changed_list |
            ($tiers | map({(.Name | split("/") | last): .Value}) | add) as $tier_map |
            [
              $accounts[] |
              select(.Name | split("/") | last != "management") |
              select($changed == "ALL" or (.Name | split("/") | last | IN($changed_list[]))) |
              {
                account: (.Name | split("/") | last),
                working_directory: ("member-accounts/" + (.Name | split("/") | last)),
                role_arn: ("arn:aws:iam::" + .Value + ":role/TerraformDeploy"),
                environment: ($tier_map[(.Name | split("/") | last)] // "production-approval"),
                account_id: .Value
              }
            ]')

          MATRIX=$(echo "$FILTERED" | jq -c '{include: .}')
          ACCOUNT_COUNT=$(echo "$FILTERED" | jq 'length')

          # Spoke accounts (production, development, ...) read SSM parameters
          # and assume a role that only exist once network has applied and
          # published them — see member-accounts/network/main.tf's own
          # "apply order" comment. Splitting network into its own matrix
          # lets apply-network run to completion before apply (everyone
          # else) starts, instead of racing it when both land in the same
          # workflow run (e.g. a shared modules/ change touches both).
          NETWORK_MATRIX=$(echo "$FILTERED" | jq -c '{include: [.[] | select(.account == "network")]}')
          NETWORK_COUNT=$(echo "$NETWORK_MATRIX" | jq '.include | length')
          OTHER_MATRIX=$(echo "$FILTERED" | jq -c '{include: [.[] | select(.account != "network")]}')
          OTHER_COUNT=$(echo "$OTHER_MATRIX" | jq '.include | length')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "account_count=$ACCOUNT_COUNT" >> "$GITHUB_OUTPUT"
          echo "network_matrix=$NETWORK_MATRIX" >> "$GITHUB_OUTPUT"
          echo "network_count=$NETWORK_COUNT" >> "$GITHUB_OUTPUT"
          echo "other_matrix=$OTHER_MATRIX" >> "$GITHUB_OUTPUT"
          echo "other_count=$OTHER_COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered and filtered accounts: $ACCOUNT_COUNT (network: $NETWORK_COUNT, other: $OTHER_COUNT)"

      - name: No accounts to apply
        if: steps.build-matrix.outputs.account_count == '0'
        run: |
          echo "⚠️ No accounts match the changed files. Skipping apply."

  # ──────────────────────────────────────────────────────────────────────────────
  # 5. Resolve Plan (download reviewed plan if available)
  # ──────────────────────────────────────────────────────────────────────────────
  resolve-plan-run:
    name: Locate and download reviewed plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - discover-accounts
    if: needs.discover-accounts.outputs.account_count != '0' && needs.discover-accounts.outputs.account_count != ''
      # Don't use job-level outputs here because this is a matrix job.
      # GitHub Actions only keeps the output from the last matrix instance to finish,
      # so it can't safely provide one output per account.
      #
      # Instead, each apply job checks its own account locally. See the
      # "Check reviewed plan actually downloaded" step.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-accounts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This workflow runs on `push` to main, so github.sha is the new merge/squash/
      # rebase commit. It won't match the PR commit that the Terraform plan used.
      #
      # Instead, we find the PR associated with this commit and download the plan
      # using the PR number. This works with all GitHub merge methods.
      #
      # If there is no PR (for example, a manual run or direct push), pr_number is
      # empty. The download step then finds no plan and the apply jobs fall back to
      # refusing the apply or creating a fresh plan.
      - name: Resolve PR number for this commit
        id: resolve-pr
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const match = prs.find(p => p.merged_at) || prs[0];
            core.setOutput('pr_number', match ? String(match.number) : '');
            core.info(match
              ? `Commit ${context.sha} -> PR #${match.number}`
              : `Commit ${context.sha} has no associated PR (direct push or workflow_dispatch)`);

      - name: Download plan artifact from previous workflow
        id: download
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yaml
          # Exactly one of pr/commit may be set (the action errors if both
          # are) — pr wins when resolve-pr found one, otherwise this falls
          # back to the (expected-to-miss) direct SHA match.
          pr: ${{ steps.resolve-pr.outputs.pr_number }}
          commit: ${{ steps.resolve-pr.outputs.pr_number == '' && github.sha || '' }}
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}
          if_no_artifact_found: warn

      - name: Check if plan was found
        id: check
        run: |
          if [ -f "${{ matrix.working_directory }}/tfplan.binary" ]; then
            echo "plan_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found reviewed plan for ${{ matrix.account }}"
            ls -la "${{ matrix.working_directory }}/tfplan.binary"
          else
            echo "plan_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No reviewed plan found for ${{ matrix.account }}"
          fi

      # retention-days raised from 5 to 30. Now that a missing artifact is a
      # hard failure on production-tier pushes rather than a silent fresh
      # plan, artifact expiry becomes a real operational trip hazard: a PR
      # opened before a week off would expire its own plan and block its own
      # merge. Keep this in sync with the two upload steps in
      # terraform-plan.yaml, which also need raising to 30.
      - name: Upload plan artifact (if found)
        if: steps.check.outputs.plan_exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/tfplan.binary
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # 6a. Apply network FIRST — spoke accounts depend on it for SSM parameters
  #     and IAM roles, so network must finish before spoke accounts start.
  #
  # This is a normal job, not a matrix, because there is only one network account.
  #
  # A zero-instance matrix reports "success" instead of "skipped". That breaks
  # the downstream check of needs.apply-network.result.
  # A normal job with if:false correctly reports "skipped", so use that instead.
  # ──────────────────────────────────────────────────────────────────────────────
  apply-network:
    name: Terraform Apply - network
    needs:
      - discover-accounts
      - resolve-plan-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.discover-accounts.outputs.network_count == '1'
    environment: ${{ fromJson(needs.discover-accounts.outputs.network_matrix).include[0].environment }}

    concurrency:
      group: tf-apply-network
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (network)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ fromJson(needs.discover-accounts.outputs.network_matrix).include[0].role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-network
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: member-accounts/network
        run: terraform init -input=false

    # Don't use needs.resolve-plan-run.outputs.plan_exists here.
    # resolve-plan-run is a matrix job, so GitHub only keeps the output from
    # whichever matrix instance finishes last — not one output per account.
    #
    # Instead, always try to download the plan and check for the file locally.
    # This is the same approach used by resolve-plan-run and correctly checks
    # whether the network plan exists.
      - name: Download reviewed plan from resolve job
        id: download-reviewed
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-network
          path: member-accounts/network

      - name: Check reviewed plan actually downloaded
        id: reviewed
        working-directory: member-accounts/network
        run: |
          if [ -f tfplan.binary ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Network is always refused on pushes if the reviewed plan is missing.
      # Unlike spoke accounts, there is no tier-based exception.
      #
      # Spokes depend on the network account's SSM parameters and IAM roles, so an
      # unreviewed network change could affect the entire repo. Therefore, an
      # unreviewed network plan must never be applied automatically on a push.e.
      - name: Refuse unreviewed apply (network)
        if: steps.reviewed.outputs.found != 'true' && github.event_name == 'push'
        run: |
          echo "::error::No reviewed plan found for network on a push to main."
          echo ""
          echo "This is not a normal condition. It means one of:"
          echo "  - the plan artifact expired (retention is 30 days)"
          echo "  - the artifact download failed or was rate limited"
          echo "  - this commit could not be resolved back to a merged PR"
          echo ""
          echo "Refusing to compute and apply an unreviewed plan to the network"
          echo "account. Open a fresh PR so terraform-plan produces a reviewable"
          echo "plan, or run this workflow via workflow_dispatch if you have"
          echo "deliberately decided a fresh plan is correct."
          exit 1

      - name: Terraform Apply (reviewed plan)
        if: steps.reviewed.outputs.found == 'true'
        working-directory: member-accounts/network
        run: |
          echo "🚀 Applying the exact plan reviewed on the merged PR for network"
          echo "📂 Working directory: member-accounts/network"
          echo ""
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      # This is only reached by workflow_dispatch.
      # All pushes are blocked above if there is no reviewed plan.
      #
      # A manual run is different because a human explicitly requested the apply
      # without a reviewed plan, so a fresh plan is allowed.
      - name: Terraform Apply (fresh plan — fallback)
        if: steps.reviewed.outputs.found != 'true' && github.event_name != 'push'
        working-directory: member-accounts/network
        run: |
          echo "⚠️ No reviewed plan for network. This run is a manual workflow_dispatch,"
          echo "   so a fresh plan is being computed and applied deliberately."
          echo "📂 Working directory: member-accounts/network"
          echo ""
          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      - name: Report apply outcome
        working-directory: member-accounts/network
        run: |
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "✅ Apply completed for network"
          echo "─────────────────────────────────────────────────────────────"

          if grep -q "No changes" apply_output.txt; then
            echo "ℹ️ No changes were applied (infrastructure already up to date)"
          else
            echo "📝 Changes applied successfully"
          fi

      - name: Apply Success Notification
        if: success()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ SUCCESS: network"
          echo "════════════════════════════════════════════════════════════"

      - name: Apply Failure Notification
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "❌ FAILED: network"
          echo "════════════════════════════════════════════════════════════"

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apply-network
          path: member-accounts/network/apply_output.txt
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────────
  # 6b. Apply every other changed account after network finishes.
  #     This prevents spoke accounts from racing network.
  #
  # !failure() && !cancelled() means "continue unless an upstream job failed
  # or was cancelled". It also allows the job to continue when network was
  # skipped because it wasn't needed.
  #
  # If network was needed but failed, all other account applies are skipped
  # to avoid applying against an incomplete or broken network state.
  # ──────────────────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply - ${{ matrix.account }}
    needs:
      - discover-accounts
      - resolve-plan-run
      - apply-network
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.discover-accounts.outputs.other_count != '0' && needs.discover-accounts.outputs.other_count != '' && !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover-accounts.outputs.other_matrix) }}

    environment: ${{ matrix.environment }}

    concurrency:
      group: tf-apply-${{ matrix.account }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (${{ matrix.account }})
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ matrix.account }}
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false

      # Don't use needs.resolve-plan-run.outputs.plan_exists here.
      # resolve-plan-run is a matrix job, so GitHub only keeps the output from the
      # matrix instance that finishes last. It does not provide one value per account.
      #
      # That means every account could read the same, incorrect value.
      # Instead, each account downloads its plan and checks the file locally.
      # This is the only reliable way for each account to verify its own reviewed plan.
      - name: Download reviewed plan from resolve job
        id: download-reviewed
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}

      - name: Check reviewed plan actually downloaded
        id: reviewed
        working-directory: ${{ matrix.working_directory }}
        run: |
          if [ -f tfplan.binary ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The tier comes from matrix.environment.
      # If an account has no tier set in SSM, discover-accounts defaults it to
      # "production-approval".
      #
      # This means a new or misconfigured account is treated as production and
      # refused if its reviewed plan is missing, instead of falling back to a
      # fresh plan. This is fail-safe.
      - name: Refuse unreviewed apply (${{ matrix.account }})
        if: steps.reviewed.outputs.found != 'true' && github.event_name == 'push' && matrix.environment == 'production-approval'
        run: |
          echo "::error::No reviewed plan found for ${{ matrix.account }} on a push to main."
          echo ""
          echo "This is not a normal condition. It means one of:"
          echo "  - the plan artifact expired (retention is 30 days)"
          echo "  - the artifact download failed or was rate limited"
          echo "  - this commit could not be resolved back to a merged PR"
          echo ""
          echo "Refusing to compute and apply an unreviewed plan to a"
          echo "production-tier account. Open a fresh PR so terraform-plan"
          echo "produces a reviewable plan, or run this workflow via"
          echo "workflow_dispatch if a fresh plan is what you actually want."
          exit 1

      - name: Terraform Apply (reviewed plan)
        if: steps.reviewed.outputs.found == 'true'
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "🚀 Applying the exact plan reviewed on the merged PR for ${{ matrix.account }} (ID: ${{ matrix.account_id }})"
          echo "📂 Working directory: ${{ matrix.working_directory }}"
          echo "🏷️ Environment: ${{ matrix.environment }}"
          echo ""
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      # This runs for manual workflow_dispatch runs, or for non-production accounts
      # on a push. Production pushes are blocked by the refusal above.
      - name: Terraform Apply (fresh plan — fallback)
        if: steps.reviewed.outputs.found != 'true' && !(github.event_name == 'push' && matrix.environment == 'production-approval')
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "⚠️ No reviewed plan for ${{ matrix.account }} (tier: ${{ matrix.environment }})."
          echo "🚀 Computing a fresh plan and applying it — permitted for this tier/event."
          echo "📂 Working directory: ${{ matrix.working_directory }}"
          echo ""
          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary
          terraform apply -input=false -lock-timeout=120s tfplan.binary 2>&1 | tee apply_output.txt

      - name: Report apply outcome
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "✅ Apply completed for ${{ matrix.account }}"
          echo "─────────────────────────────────────────────────────────────"

          if grep -q "No changes" apply_output.txt; then
            echo "ℹ️ No changes were applied (infrastructure already up to date)"
          else
            echo "📝 Changes applied successfully"
          fi

      - name: Apply Success Notification
        if: success()
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ SUCCESS: ${{ matrix.account }}"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "📋 Summary:"
          echo "  Account: ${{ matrix.account }}"
          echo "  Account ID: ${{ matrix.account_id }}"
          echo "  Environment: ${{ matrix.environment }}"
          echo "  Region: ${{ env.AWS_REGION }}"

      - name: Apply Failure Notification
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "❌ FAILED: ${{ matrix.account }}"
          echo "════════════════════════════════════════════════════════════"

      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apply-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/apply_output.txt
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────────
  # 7. Summary
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Apply Summary
    needs:
      - discover-accounts
      - apply-network
      - apply
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "🚀 APPLY SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "Accounts applied: ${{ needs.discover-accounts.outputs.account_count }}"
          echo ""
          # Guard the jq. A push that passes paths-ignore but touches nothing
          # under member-accounts/ or modules/ (scripts/, assets/, a root file)
          # leaves has_changes false, so discover-accounts is skipped and this
          # output is an empty string. Piping "" into jq exits non-zero, which
          # turned this whole run red and emailed you about a push that
          # correctly did nothing.
          MATRIX='${{ needs.discover-accounts.outputs.matrix }}'
          if [ -n "$MATRIX" ]; then
            echo "Matrix:"
            echo "$MATRIX" | jq '.include[] | {account: .account, environment: .environment}'
          else
            echo "No apply matrix (nothing under member-accounts/ or modules/ changed)."
          fi
          echo ""
          echo "apply-network: ${{ needs.apply-network.result }}"
          echo "apply:         ${{ needs.apply.result }}"

      # Without this, the summary would always be green and wouldn't be useful as a required status check.
      # Only a real "failure" blocks the merge. "Skipped" is a normal outcome.
      - name: Fail if any apply failed
        run: |
          if [ "${{ needs.apply-network.result }}" = "failure" ] || [ "${{ needs.apply.result }}" = "failure" ]; then
            echo "❌ At least one account failed to apply."
            exit 1
          fi
          echo "✅ Every account that needed an apply completed."