name: Drift Detection

# Runs every morning and answers one question: does the real infrastructure
# in AWS still match what this repo says it should look like?
#
# It does a "refresh-only" plan for each account — this only checks for
# differences, it never writes anything or changes real infrastructure, so
# it's safe to run on its own with nobody watching.
#
# If it finds drift, it does three things, in this exact order:
#   1. Opens (or updates) a PR on a per-account branch (drift/production,
#      drift/network, etc.) with a report of what changed — so a human has
#      to look at it and decide what to do, and there's a record of that.
#   2. Posts a message to Slack, but only if a webhook URL is configured.
#   3. Fails the job.
#
# Failing the job is deliberately LAST: by the time it happens, the PR
# already exists, and this failure is what triggers GitHub's own "scheduled
# workflow failed" email — the backup notification that still works even
# if Slack is down or the PR step itself breaks.

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

# There's no top-level permissions block on purpose — each job below asks
# for exactly what it needs, so a step added later to discover-accounts or
# summary doesn't quietly end up with write access nobody gave it on
# purpose.

# Only one of these runs at a time. Without this, a manually-triggered run
# starting while the scheduled one is still going could collide over the
# same drift/<account> branches.
concurrency:
  group: drift-detection
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: "eu-west-2"

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Find every account, by reading the list stored in SSM. Same idea as
  #    terraform-plan.yaml, but without filtering down to "only changed
  #    accounts" — drift can show up in an account nobody's touched
  #    recently, so this checks every account, every night.
  # ──────────────────────────────────────────────────────────────────────────────
  discover-accounts:
    name: Discover Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only: only needs to assume the discovery role over OIDC.
    permissions:
      id-token: write
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      account_count: ${{ steps.build-matrix.outputs.account_count }}
    steps:
      - name: Configure AWS credentials (discovery role, read-only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DISCOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-drift-discovery
          retry-max-attempts: 3

      - name: Build matrix from SSM
        id: build-matrix
        run: |
          ACCOUNTS=$(aws ssm get-parameters-by-path \
            --path "/organizations/accounts/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          MATRIX=$(jq -c -n --argjson accounts "$ACCOUNTS" '
            {
              include: [
                $accounts[] |
                select(.Name | split("/") | last != "management") |
                {
                  account: (.Name | split("/") | last),
                  working_directory: ("member-accounts/" + (.Name | split("/") | last)),
                  role_arn: ("arn:aws:iam::" + .Value + ":role/TerraformPlan"),
                  account_id: .Value
                }
              ]
            }')

          ACCOUNT_COUNT=$(echo "$MATRIX" | jq '.include | length')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "account_count=$ACCOUNT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered accounts: $ACCOUNT_COUNT"

  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Run a refresh-only plan for each account, one job per account.
  # ──────────────────────────────────────────────────────────────────────────────
  drift-check:
    name: Check Drift - ${{ matrix.account }}
    needs: discover-accounts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.discover-accounts.outputs.account_count != '0' && needs.discover-accounts.outputs.account_count != ''
    # This is the only job in the whole workflow that actually writes
    # anything: it assumes each account's read-only TerraformPlan role,
    # pushes to the drift/<account> branch, and opens or comments on the
    # drift PR.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      # Caps how many accounts get checked at once, so as the number of
      # accounts grows, this doesn't suddenly fire off dozens of AWS calls
      # simultaneously at 2am and start hitting rate limits.
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover-accounts.outputs.matrix) }}

    # This has to live at the job level, not on the step itself — a step's
    # own `if:` condition can't see an environment variable that the same
    # step defines. Putting it here is what lets the Slack step below skip
    # cleanly when no webhook secret is configured, instead of erroring.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (${{ matrix.account }})
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-drift-${{ matrix.account }}
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false -lockfile=readonly

      # -detailed-exitcode is what makes this whole check possible. Without
      # it, terraform plan always exits 0, whether or not there's a diff —
      # so there'd be no way to tell "clean" from "drifted" afterwards. With
      # it: 0 means clean, 1 means terraform itself hit an error, 2 means
      # drift was found.
      #
      # -lock=false is deliberate, not a gap: a refresh-only plan never
      # writes to state, so there's nothing a lock would protect here — and
      # skipping it means a manual apply holding the lock can't cause this
      # 2am check to fail for no reason.
      - name: Terraform Plan (refresh-only drift check)
        id: plan
        working-directory: ${{ matrix.working_directory }}
        
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false \
            -refresh-only -detailed-exitcode 2>&1 | tee drift_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          echo "drift_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "Exit code $exit_code  (0 = clean, 1 = terraform error, 2 = drift)"

          if [ "$exit_code" -eq 1 ]; then
            echo "::error::terraform plan itself failed for ${{ matrix.account }}. This is not drift, it is a broken plan."
            exit 1
          fi

          if [ "$exit_code" -eq 0 ]; then
            echo "### Clean: \`${{ matrix.account }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Pulls just the resource addresses out of the plan text, e.g.
      # "aws_x.y" from a line like "  # aws_x.y has changed" or
      # "has been deleted", so the report below stays short and readable.
      - name: Summarise drift
        id: summary
        if: steps.plan.outputs.drift_exit_code == '2'
        working-directory: ${{ matrix.working_directory }}
        run: |
          CHANGED=$(grep -E '^[[:space:]]*# .* (has changed|has been deleted)' drift_output.txt \
            | sed 's/^[[:space:]]*# //' || true)
          COUNT=$(printf '%s' "$CHANGED" | grep -c . || true)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "resources<<DRIFT_EOF"
            echo "$CHANGED"
            echo "DRIFT_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Drift: \`${{ matrix.account }}\` ($COUNT resource(s))"
            echo ""
            echo '```'
            echo "$CHANGED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-report-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/drift_output.txt
          retention-days: 30
          if-no-files-found: warn

      # Uses one stable branch name per account (drift/production, not
      # drift/production-20260813) so each night's run updates the SAME
      # pull request instead of opening a fresh one every time. The
      # force-push just rebases tonight's report onto the latest main.
      #
      # Every ${{ }} value the script needs is passed in through env,
      # rather than typed directly into the shell text below. That's not
      # just style — pasting a GitHub value straight into a run: block is
      # the classic way these workflows get script-injected, so this keeps
      # that path closed, even though these particular values come from AWS.
      - name: Open or update drift PR
        if: steps.plan.outputs.drift_exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT: ${{ matrix.account }}
          WORKDIR: ${{ matrix.working_directory }}
          DRIFT_COUNT: ${{ steps.summary.outputs.count }}
          DRIFT_RESOURCES: ${{ steps.summary.outputs.resources }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="drift/${ACCOUNT}"

          # Safe to run every time: if the label is already there, this
          # just fails quietly and moves on.
          gh label create drift \
            --color d93f0b \
            --description "Live infrastructure has drifted from Terraform" 2>/dev/null || true

          # This file only ever gets resource addresses, never the raw plan
          # output. The full plan text can contain real attribute values —
          # Terraform only hides a field if its schema explicitly marks it
          # sensitive — and this file gets committed into git history via
          # the PR below, which is forever. Anyone who needs the full plan
          # with real values can pull it from the drift-report-${ACCOUNT}
          # workflow artifact instead (kept 30 days, access-controlled) —
          # no need for a second, permanent copy sitting in git.
          mkdir -p .drift
          {
            echo "# Drift report: ${ACCOUNT}"
            echo
            echo "Generated $(date -u +'%Y-%m-%d %H:%M UTC') by run ${RUN_URL}"
            echo
            echo "**Drifted resources (${DRIFT_COUNT}):**"
            echo
            echo '```'
            echo "${DRIFT_RESOURCES}"
            echo '```'
            echo
            echo "Resource addresses only, no attribute values. For the full plan output, download the \`drift-report-${ACCOUNT}\` artifact from run ${RUN_URL} (kept 30 days)."
          } > ".drift/${ACCOUNT}.md"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -f ".drift/${ACCOUNT}.md"
          git commit -m "drift: ${ACCOUNT} ($(date -u +%Y-%m-%d))"
          git push -f origin "$BRANCH"

          {
            echo "Refresh-only plan for \`${ACCOUNT}\` is **not empty**. Live AWS no longer matches this repo."
            echo
            echo "**Drifted resources (${DRIFT_COUNT}):**"
            echo
            echo '```'
            echo "${DRIFT_RESOURCES}"
            echo '```'
            echo
            echo "Full report: \`.drift/${ACCOUNT}.md\` on this branch. Workflow run: ${RUN_URL}"
            echo
            echo "**Pick one:**"
            echo
            echo "1. **Revert.** The change was not intended. Close this PR without merging and let the next apply put it back."
            echo "2. **Adopt.** The change was intended. Push the matching Terraform for \`${WORKDIR}\` onto this branch, then merge."
            echo
            echo "Do not merge this as-is. On its own it only adds a report file."
          } > /tmp/pr_body.md

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --body \
              "Still drifting as of $(date -u +'%Y-%m-%d'): ${DRIFT_COUNT} resource(s). Run: ${RUN_URL}"
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "drift: ${ACCOUNT} (${DRIFT_COUNT} resources)" \
              --body-file /tmp/pr_body.md \
              --label drift
          fi

      # If no Slack webhook secret is configured, this step just skips
      # itself — nothing else in the file needs to change either way.
      - name: Notify Slack
        if: steps.plan.outputs.drift_exit_code == '2' && env.SLACK_WEBHOOK_URL != ''
        env:
          ACCOUNT: ${{ matrix.account }}
          DRIFT_COUNT: ${{ steps.summary.outputs.count }}
          DRIFT_RESOURCES: ${{ steps.summary.outputs.resources }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # -f makes curl fail the step loudly on a 403/404 (e.g. a rotated
          # webhook URL) instead of quietly reporting success while nothing
          # actually got sent.
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n \
              --arg acct "$ACCOUNT" \
              --arg count "$DRIFT_COUNT" \
              --arg url "$RUN_URL" \
              --arg body "$DRIFT_RESOURCES" \
              '{text: ("*Drift detected* in `" + $acct + "` (" + $count + " resource(s))\nA PR has been opened. <" + $url + "|View run>\n```\n" + $body + "\n```")}')"

      # Deliberately the LAST step: everything above needs to have already
      # run before this job is allowed to go red. Turning the job red is
      # what triggers GitHub's own "scheduled workflow failed" email — the
      # one signal that still gets through even if Slack or the PR step
      # above happens to break.
      - name: Fail the job on drift
        if: steps.plan.outputs.drift_exit_code == '2'
        run: |
          echo "::error::Drift detected in ${{ matrix.account }} (${{ steps.summary.outputs.count }} resource(s)). See the drift/${{ matrix.account }} pull request."
          exit 1

  # ──────────────────────────────────────────────────────────────────────────────
  # 3. One check name that stays the same no matter which accounts are in
  #    the matrix that night. Gives a stable row to look at on a dashboard,
  #    and a place to hang more reporting later if needed.
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Drift Summary
    needs:
      - discover-accounts
      - drift-check
    runs-on: ubuntu-latest
    if: always()
    # This job only reads outputs from the other jobs and writes to the
    # step summary — it doesn't need any GITHUB_TOKEN permission at all.
    permissions: {}
    steps:
      - name: Report
        run: |
          echo "Accounts checked: ${{ needs.discover-accounts.outputs.account_count }}"
          echo "drift-check result: ${{ needs.drift-check.result }}"

          if [ "${{ needs.drift-check.result }}" = "failure" ]; then
            echo "## Drift detected in at least one account" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## All accounts clean" >> "$GITHUB_STEP_SUMMARY"