name: Terraform Plan

# Runs whenever a Pull Request (PR) is opened or updated and is going to be merged into main.
# This workflow only checks what Terraform would change. It does NOT make any changes.

# The list of AWS accounts is automatically loaded from SSM.
# it checks the account folders that were changed in the PR.
# To add a new account, we only need to create its folder and add its SSM parameter.
# we do not need to change this workflow.

# Terraform creates a plan file (tfplan.binary) for each account.
# The plan is saved and uploaded as an artifact.
# The Apply workflow uses this exact same plan after the PR is merged.
# This means the changes reviewed in the PR are exactly the changes that will be applied.
# We don't create a new plan later, which could be different if something changed in the meantime.

on:
#
# This workflow handles the required checks for the main branch:
# - Check Terraform formatting and validity
# - Run a security scan
# - Show a summary of the Terraform plan
#
# The detect-changes job checks what files were changed.
# The three check jobs always run, so GitHub always gets a status for each check.
#
# If no Terraform files were changed, the jobs skip the expensive steps.
# The jobs still finish successfully (green) because skipping a step does not make the whole job fail.

  pull_request: # runs automatically when a PR targets main
    branches: [main]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write   # required for Checkov's SARIF upload to GitHub Security tab

concurrency:
  group: tf-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: "eu-west-2"

# ──────────────────────────────────────────────────────────────────────────────
# The jobs below are written in the order GitHub actually runs them, top to
# bottom.
# ──────────────────────────────────────────────────────────────────────────────
#   1. detect-changes    (no needs — runs first)
#   2. validate-format   needs: detect-changes
#   3. security-scan     needs: detect-changes
#   4. discover-accounts needs: detect-changes, validate-format
#   5. plan              needs: discover-accounts
#   6. infracost         needs: discover-accounts, plan
#   7. summary           needs: discover-accounts, plan, infracost
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Classify the changes (diff)
  #
  # This is the first job that runs, so it has no "needs:" dependency.
  #
  # It checks which files were changed and decides whether Terraform files
  # need to be checked.
  #
  # The Validate & Format job uses the result from this job to decide
  # whether it needs to run the Terraform checks.
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # This checks whether any terraform files(t.f) have been changed and actually needs to be validated.
      # The result is used by the Validate & Format and Security Scan jobs to decide whether their main steps should run.
      tf_changed: ${{ steps.classify.outputs.tf_changed }}
      # This checks which member accounts were changed.
      # The result is then used to decide which accounts need a Terraform plan.
      # Each changed account is added to the plan matrix.
      changed_accounts: ${{ steps.filter.outputs.changed_accounts }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
      # true for a same-repo PR, workflow_dispatch, or any non-PR trigger;
      # false only for a PR opened from a fork. GitHub never mints an OIDC
      # token or a write-scoped GITHUB_TOKEN for a fork PR, so the `plan`
      # and `discover-accounts` jobs below are already safe — they fail at
      # "Configure AWS credentials" before ever running `terraform init` on
      # fork-supplied code. The one job that ISN'T gated by AWS credentials
      # at all is validate-format's "Terraform Validate (all accounts)"
      # step, which runs `terraform init` unconditionally to check syntax —
      # and `terraform init` fetches whatever provider a fork's own
      # required_providers block names, from wherever it names, before
      # validate ever runs. This output is what stops that step from
      # running on fork-supplied Terraform at all.
      same_repo: ${{ steps.fork-check.outputs.same_repo }}
    steps:
      # clone our repository onto the runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # this step checks whether the PR is from a forked repository. If it is, it sets the same_repo output to false. 
      # This is important because we don't want to run Terraform init/validate against code from a fork, as it could fetch untrusted providers.
      - name: Check whether this run is from a fork
        id: fork-check
        env:
      #  this environment variable is true if the PR is from a forked repository, and false otherwise.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR detected — Terraform init/validate will not run against fork-supplied code."
          else
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          fi

      # This step checks which files were changed in the PR and whether any of them are Terraform files (not docs or prose). 
      # It sets the tf_changed output to true if any Terraform files were changed, and false otherwise.
      - name: Classify changed files
        id: classify
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse HEAD~1)   # workflow_dispatch has no PR context
          fi
          echo "Comparing $BASE...HEAD"

          ALL=$(git diff --name-only "$BASE" HEAD || echo "")
          echo "Changed files:"
          echo "$ALL" | sed 's/^/  /'

          RELEVANT=$(echo "$ALL" | grep -v -E '\.(md|txt)$|^docs/|^\.gitignore|^\.drift/' || true)

          if [ -n "$RELEVANT" ]; then
            echo "tf_changed=true" >> "$GITHUB_OUTPUT"
            echo "-> Terraform-relevant changes present"
          else
            echo "tf_changed=false" >> "$GITHUB_OUTPUT"
            echo "-> docs or prose only. Expensive steps skip; required checks still report."
          fi
      # This step checks which account folders were changed in the PR.
      - name: Detect changed account folders
        id: filter
        if: steps.classify.outputs.tf_changed == 'true'
        run: |
          # modules/ gets checked first, and separately, from everything
          # else. A shared module has no single account that owns it — any
          # account using it could be affected — and without a real
          # dependency graph mapping which module feeds which account, the
          # only safe answer to "which accounts changed" is "all of them".
          # This is deliberately blunter than the member-accounts/ diff
          # below: a module-only change costs a few extra minutes of CI
          # re-planning every account, which is a much smaller problem than
          # silently never planning the accounts that actually depend on
          # it — the failure mode this is here to prevent.
          CHANGED_MODULE_FILES=$(git diff --name-only origin/main...HEAD -- modules/ || echo "")

          if [ -n "$CHANGED_MODULE_FILES" ]; then
            echo "Changed files under modules/:"
            echo "$CHANGED_MODULE_FILES"
            echo "-> treating every discovered account as changed"
            echo "changed_accounts=ALL" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get list of changed files in member-accounts/ compared to base branch
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- member-accounts/ || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected in member-accounts/ or modules/"
            echo "changed_accounts=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract unique account names from changed paths
          # e.g., member-accounts/production/main.tf → production
          CHANGED_ACCOUNTS=$(echo "$CHANGED_FILES" | \
            grep -E 'member-accounts/[^/]+/' | \
            sed 's|member-accounts/\([^/]*\)/.*|\1|' | \
            sort -u | \
            tr '\n' ',' | \
            sed 's/,$//')

          echo "Changed files: $CHANGED_FILES"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          echo "changed_accounts=$CHANGED_ACCOUNTS" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Validate & Format
  #
  # This is a REQUIRED CHECK, so the job always runs and reports a result.
  #
  # The actual Terraform checks only run when Terraform files have changed.
  # If the PR only changes documentation, those Terraform steps are skipped.
  #
  # Skipping the steps does not make the job fail, so GitHub still shows
  # "Validate & Format" as green.
  #
  # This means a docs-only PR gets a green check in about a minute instead of
  # waiting for a check that never runs.
  # ──────────────────────────────────────────────────────────────────────────────
  validate-format:
    name: Validate & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - detect-changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skipping (no Terraform changes)
        if: needs.detect-changes.outputs.tf_changed != 'true'
        run: echo "Docs or prose only. Nothing to format or validate."

      - name: Setup Terraform
        if: needs.detect-changes.outputs.tf_changed == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # this step checks the formatting of all Terraform files in the repository. 
      # It runs `terraform fmt -check -recursive -diff` to check for formatting issues and outputs any differences.
      - name: Terraform Format Check
        if: needs.detect-changes.outputs.tf_changed == 'true'
        run: terraform fmt -check -recursive -diff

      # this step validates the Terraform configuration for all accounts.
      - name: Skipping Terraform Validate (fork PR)
        if: needs.detect-changes.outputs.tf_changed == 'true' && needs.detect-changes.outputs.same_repo != 'true'
        run: |
          echo "::notice::Terraform init/validate does not run against a fork PR's own code — terraform init would fetch whatever provider the fork's required_providers block names. A maintainer can re-run this via workflow_dispatch on a branch in this repo to validate it for real."
      # this step validates the Terraform configuration for all accounts, but only if the PR is from the same repository (not a fork).
      - name: Terraform Validate (all accounts)
        if: needs.detect-changes.outputs.tf_changed == 'true' && needs.detect-changes.outputs.same_repo == 'true'
        run: |
          for dir in member-accounts/*/; do
            echo "Validating $dir..."
            ( cd "$dir" && terraform init -backend=false && terraform validate )
          done

  # ──────────────────────────────────────────────────────────────────────────────────────────────────────────
  # 3. Security Scan (Checkov)
  # ──────────────────────────────────────────────────────────────────────────────────────────────────────────
  # this job runs a security scan using Checkov, a static code analysis tool for Terraform.
  # It checks for security misconfigurations and best practices in the Terraform code.
  # The job only runs the scan if Terraform files have changed, as determined by the detect-changes job.
  # If no Terraform files have changed, the job skips the scan and reports a successful result.
  # ──────────────────────────────────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - detect-changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skipping (no Terraform changes)
        if: needs.detect-changes.outputs.tf_changed != 'true'
        run: echo "Docs or prose only. Nothing to scan."

      - name: Checkov Security Scan - All Accounts
        id: checkov
        if: needs.detect-changes.outputs.tf_changed == 'true'
        # Pinned to the commit that bumps the container to checkov 3.3.11 —
        # kept in sync with this file's own pip-installed checkov below
        # (`pip install --quiet checkov==3.3.11`) and with Terraform-Org's
        # terraform.yaml checkov-action pin, which had drifted to 3.3.10.
        # Bump this comment's version number in all three places at once.
        uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # checkov 3.3.11
        with:
          directory: member-accounts/
          config_file: .checkov.yaml
          output_format: cli,sarif
          download_external_modules: ${{ needs.detect-changes.outputs.same_repo == 'true' }}
          quiet: false
       #  soft_fail: true

    # this step uploads the Checkov SARIF report as an artifact, so it can be downloaded and reviewed later.
    # it only runs if Terraform files have changed, as determined by the detect-changes job.
      - name: Upload Checkov SARIF report
        if: always() && needs.detect-changes.outputs.tf_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov-report
          path: results.sarif
          retention-days: 7
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Security tab
        if: always() && needs.detect-changes.outputs.tf_changed == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: checkov

  # ──────────────────────────────────────────────────────────────────────────────
  # 4. Discover accounts from SSM AND filter by changed accounts
  # ──────────────────────────────────────────────────────────────────────────────
  discover-accounts:
    name: Discover & Filter Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      
      - validate-format

    # Only run if there are actual changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      account_count: ${{ steps.build-matrix.outputs.account_count }}
    steps:
      - name: Configure AWS credentials (discovery role — read-only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DISCOVERY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-discover-accounts
          retry-max-attempts: 3

      - name: Build matrix from SSM AND filter by changed accounts
        id: build-matrix
        run: |
          # Get changed accounts from previous job
          CHANGED_ACCOUNTS="${{ needs.detect-changes.outputs.changed_accounts }}"
          echo "Changed accounts: $CHANGED_ACCOUNTS"

          # Get all accounts from SSM
          ACCOUNTS=$(aws ssm get-parameters-by-path \
            --path "/organizations/accounts/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          # Get tiers from SSM
          TIERS=$(aws ssm get-parameters-by-path \
            --path "/organizations/tiers/" \
            --recursive \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)

          # Build matrix filtered by changed accounts AND SSM discovery.
          # $changed == "ALL" (set by detect-changes when modules/ changed)
          # bypasses the IN($changed_list[]) filter entirely, so every
          # discovered account is included instead of just the ones with a
          # direct member-accounts/ change.
          MATRIX=$(jq -c -n --argjson accounts "$ACCOUNTS" --argjson tiers "$TIERS" --arg changed "$CHANGED_ACCOUNTS" '
            ($changed | split(",")) as $changed_list |
            ($tiers | map({(.Name | split("/") | last): .Value}) | add) as $tier_map |
            {
              include: [
                $accounts[] |
                select(.Name | split("/") | last != "management") |
                select($changed == "ALL" or (.Name | split("/") | last | IN($changed_list[]))) |
                {
                  account: (.Name | split("/") | last),
                  working_directory: ("member-accounts/" + (.Name | split("/") | last)),
                  role_arn: ("arn:aws:iam::" + .Value + ":role/TerraformPlan"),
                  environment: ($tier_map[(.Name | split("/") | last)] // "production-approval"),
                  account_id: .Value
                }
              ]
            }')

          ACCOUNT_COUNT=$(echo "$MATRIX" | jq '.include | length')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "account_count=$ACCOUNT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered and filtered accounts: $ACCOUNT_COUNT"

          if [ "$ACCOUNT_COUNT" -eq 0 ]; then
            echo "⚠️ No matching accounts found for changed folders"
          fi

      - name: No accounts to plan
        if: steps.build-matrix.outputs.account_count == '0'
        run: |
          echo "⚠️ No accounts match the changed files. Skipping plan."
          echo "Changed files may be in shared modules or non-account directories."

  # ──────────────────────────────────────────────────────────────────────────────
  # 5. Plan ONLY for changed and discovered accounts
  # ──────────────────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan - ${{ matrix.account }}
    needs:
      - discover-accounts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if we have accounts to plan
    if: needs.discover-accounts.outputs.account_count != '0' && needs.discover-accounts.outputs.account_count != ''
    # Job-level permissions fully replace the workflow-level block above for
    # this job, rather than adding to it — so everything this job actually
    # uses (OIDC for AWS, checkout, the PR-comment step) has to be repeated
    # here alongside the one addition, attestations: write, needed for
    # "Attest plan provenance" below.
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-accounts.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (${{ matrix.account }})
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.account }}
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false


      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.working_directory }}
        continue-on-error: true
        run: |
          echo "📋 Planning for ${{ matrix.account }} (ID: ${{ matrix.account_id }})"
          echo "Working directory: ${{ matrix.working_directory }}"
          echo "Environment: ${{ matrix.environment }}"
          echo ""

          terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan.binary 2>&1 | tee plan_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "plan_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo ""
          echo "─────────────────────────────────────────────────────────────"
          echo "📝 Plan exit code: $exit_code"
          echo "─────────────────────────────────────────────────────────────"
          if [ $exit_code -ne 0 ]; then
            echo "❌ Terraform plan FAILED with exit code: $exit_code"
            echo ""
            echo "🔍 Full error output:"
            echo "─────────────────────────────────────────────────────────────"
            tail -50 plan_output.txt
            echo "─────────────────────────────────────────────────────────────"
          else
            echo "✅ Terraform plan SUCCEEDED"
          fi

          # Detects destructive changes by reading the "Z to destroy" count
          # from Terraform's own summary line — that single number already
          # covers both plain destroys and the destroy half of a "-/+
          # replace", so there's no need to pattern-match individual
          # resource lines. This doesn't block the job — a deliberate
          # destroy is sometimes exactly the right call — it just makes
          # sure one can't slip through a merge unnoticed.
          DESTROY_COUNT=$(grep -oE '[0-9]+ to destroy' plan_output.txt | grep -oE '^[0-9]+' | head -1)
          DESTROY_COUNT=${DESTROY_COUNT:-0}
          if [ "$DESTROY_COUNT" -gt 0 ]; then
            echo "⚠️  Plan destroys/replaces $DESTROY_COUNT resource(s)"
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Plan Exit Code
        if: steps.plan.outputs.plan_exit_code != '0'
        run: |
          echo "❌ Terraform plan failed for ${{ matrix.account }}"
          echo ""
          echo "🔧 To fix this issue:"
          echo "  1. Run 'terraform plan' locally in ${{ matrix.working_directory }}"
          echo "  2. Check the detailed error output in the logs above"
          echo "  3. Verify SSM parameters and provider configuration"
          exit 1

      # this     
      - name: Post plan as PR comment (Success)
        if: github.event_name == 'pull_request' && steps.plan.outputs.plan_exit_code == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = `${{ matrix.working_directory }}/plan_output.txt`;
            let output = '(no output captured)';
            try {
              output = fs.readFileSync(path, 'utf8');
            } catch (e) {}

            const fullLogLink = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            if (output.length > 60000) {
              output = output.slice(0, 60000) + `\n... (truncated, [view full logs](${fullLogLink}))`;
            }

            const hasChanges = !output.includes("No changes") && !output.includes("0 to add, 0 to change, 0 to destroy");
            const isDestructive = '${{ steps.plan.outputs.has_destructive }}' === 'true';
            const statusIcon = isDestructive ? '💥' : (hasChanges ? '📝' : '✅');
            const destructiveBanner = isDestructive
              ? `\n> ⚠️ **This plan destroys or replaces at least one resource in \`${{ matrix.account }}\`.** Review the diff carefully before merging — this is not necessarily wrong, but it needs a deliberate look, not a skim.\n`
              : '';

            const marker = `<!-- terraform-plan-account:${{ matrix.account }} -->`;
            const body = `${marker}\n### ${statusIcon} Terraform Plan — \`${{ matrix.account }}\` (ID: ${{ matrix.account_id }})\n${destructiveBanner}\n<details><summary>Show plan output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>\n\n**Environment:** \`${{ matrix.environment }}\``;

            if (isDestructive) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['destructive-change'],
                });
              } catch (e) {
                // Label doesn't exist in this repo yet — create it once, then retry.
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'destructive-change',
                  color: 'd93f0b',
                  description: "This PR's plan destroys or replaces at least one resource",
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['destructive-change'],
                });
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      # upload the plan output and the binary plan file as artifacts for later reuse in the apply workflow
      - name: Upload plan log artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/plan_output.txt
          retention-days: 7

      # Stamps this plan with the exact commit it was computed from, and
      # hashes both files together. terraform-apply.yaml's resolve-plan-run
      # job checks this against the merged PR's actual head commit before
      # ever letting anything apply it without this, a plan reviewed at
      # commit A and a later commit B pushed to the same PR are
      # indistinguishable by filename alone; whichever one this workflow
      # last uploaded as tfplan-<account> is what apply would use.
      #
      # github.event.pull_request.head.sha is empty on workflow_dispatch
      # (no PR context) — falls back to github.sha, the commit this run
      # itself checked out, which is what apply's own commit-based fallback
      # path compares against in that case.
      - name: Stamp plan with head commit SHA
        if: steps.plan.outputs.plan_exit_code == '0'
        working-directory: ${{ matrix.working_directory }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "$HEAD_SHA" > tfplan.sha
          sha256sum tfplan.binary tfplan.sha > tfplan.sha256
          echo "Stamped plan for ${{ matrix.account }} with commit $HEAD_SHA"

      - name: Attest plan provenance
        if: steps.plan.outputs.plan_exit_code == '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.working_directory }}/tfplan.binary

      - name: Upload plan file for apply reuse
        if: steps.plan.outputs.plan_exit_code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ matrix.account }}
          path: |
            ${{ matrix.working_directory }}/tfplan.binary
            ${{ matrix.working_directory }}/tfplan.sha
            ${{ matrix.working_directory }}/tfplan.sha256
          retention-days: 30

# ── Policy scan of the RESOLVED plan ────────────────────────────────────
      # The security-scan job above only reads raw HCL, so it can't see
      # anything that only exists after Terraform actually evaluates
      # everything — tfvars values, module outputs, data source results,
      # count/for_each expansion. This second pass reads the plan's JSON
      # instead, where all of that has already been worked out, and catches
      # what a plain source-code scan structurally can't.
      #
      # This runs inside the same job as the plan, rather than as its own
      # separate job, on purpose: Terraform is already initialized here,
      # credentials are already assumed, and tfplan.binary is already sitting
      # on disk. A separate job would repeat checkout, setup-terraform, an
      # OIDC assume, and a terraform init six times over — one per account —
      # for zero extra coverage.
      #
      # Placed AFTER the artifact upload on purpose too: if this scan fails,
      # the job fails and Plan Summary blocks the merge — but the plan
      # artifact and the PR comment are still there for someone to read.
      - name: Convert plan to JSON
        if: steps.plan.outputs.plan_exit_code == '0'
        working-directory: ${{ matrix.working_directory }}
        run: terraform show -no-color -json tfplan.binary > plan.json

      - name: Checkov policy scan (resolved plan)
        if: steps.plan.outputs.plan_exit_code == '0'
        env:
          # Without this, Checkov only reads the plan's `after` values. When a
          # resource is created in the same plan as something it depends on —
          # say, a CloudWatch log group's kms_key_id pointing at a KMS key
          # being created right alongside it — that value shows up as
          # `(known after apply)`, meaning `after` is null. A check like
          # CKV_AWS_158, which just looks for "is this value set?", reads that
          # as "not set" and fails, even though the HCL genuinely does set it.
          # This setting tells Checkov to treat `(known after apply)` as "this
          # will have a value" instead of "this has no value". Checkov's own
          # source for this: checkov/terraform/plan_parser.py, _eval_after_unknown().
          EVAL_TF_PLAN_AFTER_UNKNOWN: "true"
        run: |
          # 3.3.11 — kept in sync with this file's checkov-action pin above
          # and Terraform-Org's terraform.yaml checkov-action pin. All three
          # were on different versions (3.3.10/3.3.11/3.3.13) until 2026-08-27.
          pip install --quiet checkov==3.3.11
          checkov \
            --file "${{ matrix.working_directory }}/plan.json" \
            --repo-root-for-plan-enrichment "${{ matrix.working_directory }}" \
            --framework terraform_plan \
            --config-file .checkov.yaml \
            --compact --quiet
  # ──────────────────────────────────────────────────────────────────────────────
  # 6. Cost Estimation (Infracost)
  # ──────────────────────────────────────────────────────────────────────────────
  infracost:
    name: Cost Estimation - ${{ matrix.account }}
    needs:
      - discover-accounts
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs when we have accounts to estimate
    if: |
      github.event_name == 'pull_request' &&
      needs.discover-accounts.outputs.account_count != '0' &&
      needs.discover-accounts.outputs.account_count != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-accounts.outputs.matrix) }}
    env:
      # Set globally rather than via the setup action's api-key input — some users
      # hit "Invalid API key" errors with the input param, the global env var is
      # the more reliable path recommended by Infracost.
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Terraform plan artifact from plan job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ matrix.account }}
          path: ${{ matrix.working_directory }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (${{ matrix.account }})
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-infracost-${{ matrix.account }}
          retry-max-attempts: 3

      - name: Terraform Init
        working-directory: ${{ matrix.working_directory }}
        run: terraform init -input=false

      - name: Convert plan to JSON
        working-directory: ${{ matrix.working_directory }}
        run: terraform show -no-color -json tfplan.binary > plan.json

      - name: Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: latest

      - name: Verify Infracost installation
        run: |
          echo "✅ Infracost installed successfully"
          infracost --version

      - name: Verify plan JSON exists
        working-directory: ${{ matrix.working_directory }}
        run: |
          echo "Checking for plan.json..."
          if [ -s plan.json ]; then
            echo "✅ plan.json exists"
            echo "File size: $(du -h plan.json | cut -f1)"
          else
            echo "❌ plan.json not found or empty!"
            exit 1
          fi

      - name: Run Infracost
        id: infracost
        working-directory: ${{ matrix.working_directory }}
        continue-on-error: true
        run: |
          echo "💰 Generating cost estimate for ${{ matrix.account }}..."
          echo ""

          infracost breakdown --path plan.json \
            --format table \
            --out-file cost_output.txt 2>&1

          if [ -s cost_output.txt ]; then
            echo "✅ Cost estimate generated successfully"
            echo "cost_generated=true" >> "$GITHUB_OUTPUT"
            cat cost_output.txt

            echo "## 💰 Cost Estimate — \`${{ matrix.account }}\`" > infracost_output.md
            echo "" >> infracost_output.md
            echo "\`\`\`" >> infracost_output.md
            cat cost_output.txt >> infracost_output.md
            echo "\`\`\`" >> infracost_output.md
          else
            echo "⚠️ No cost estimate generated"
            echo "cost_generated=false" >> "$GITHUB_OUTPUT"

            echo "🔍 Checking plan.json contents for debugging..."
            infracost breakdown --path plan.json --format json --out-file cost_debug.json 2>&1 || true

            if [ -f cost_debug.json ]; then
              RESOURCE_COUNT=$(jq '.projects[0].breakdown.resources | length' cost_debug.json 2>/dev/null || echo "0")
              echo "Resources found: $RESOURCE_COUNT"
            fi

            cat > infracost_output.md << EOF
          ## ⚠️ Cost Estimate — \`${{ matrix.account }}\`

          No cost estimate could be generated for this account.

          **Possible reasons:**
          - INFRACOST_API_KEY secret is missing or invalid — check repo Settings → Secrets and variables → Actions
          - No billable resources were found in the Terraform plan
          - plan.json failed to generate correctly

          **Debug information:**
          - plan.json exists: \`$(test -s plan.json && echo "Yes" || echo "No")\`
          - plan.json size: \`$(du -h plan.json 2>/dev/null | cut -f1 || echo "N/A")\`
          EOF
          fi

      - name: Post Infracost comment to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = `${{ matrix.working_directory }}/infracost_output.md`;
            let output = '⚠️ No cost estimate available.';
            try {
              if (fs.existsSync(path)) {
                output = fs.readFileSync(path, 'utf8');
              }
            } catch (e) {
              output = `⚠️ Error reading cost estimate: ${e.message}`;
            }

            // Truncate if too long
            if (output.length > 60000) {
              output = output.slice(0, 60000) + '\n... (truncated)';
            }

            const marker = `<!-- infracost-account:${{ matrix.account }} -->`;
            const body = `${marker}\n${output}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload cost report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cost-report-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/infracost_output.md
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Infracost debug JSON
        if: failure() || steps.infracost.outputs.cost_generated == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infracost-debug-${{ matrix.account }}
          path: ${{ matrix.working_directory }}/cost_debug.json
          retention-days: 3
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────────
  # 7. Summary
  # ──────────────────────────────────────────────────────────────────────────────
  summary:
    name: Plan Summary
    needs:
      - discover-accounts
      - plan
      - infracost
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ PLAN SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "Accounts planned: ${{ needs.discover-accounts.outputs.account_count }}"
          echo ""
          # Guard the jq: on a docs-only PR discover-accounts is skipped, so
          # this output is an empty string. Piping "" into jq exits non-zero
          # and would turn this required check red for a README edit, which is
          # exactly the failure this whole restructure exists to remove.
          MATRIX='${{ needs.discover-accounts.outputs.matrix }}'
          if [ -n "$MATRIX" ]; then
            echo "Matrix:"
            echo "$MATRIX" | jq '.include[] | {account: .account, environment: .environment}'
          else
            echo "No plan matrix (no Terraform changes in this PR)."
          fi
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "📊 Infracost Status:"
          echo "  - Authenticated via INFRACOST_API_KEY secret"
          echo "  - Cost estimates posted as PR comments"
          echo "  - Reports saved as artifacts"
          echo "════════════════════════════════════════════════════════════"

      # This job always has the same name, no matter which accounts are in the matrix.
      # That makes it safe to use as a required status check.
      #
      # "Plan Summary" only fails when something actually fails.
      # discover-accounts or plan being skipped is okay (for example, when nothing changed).
      # So a skipped job won't block the merge, but a real failure will.
      - name: Fail if any account's plan failed
        run: |
          DISCOVER_RESULT="${{ needs.discover-accounts.result }}"
          PLAN_RESULT="${{ needs.plan.result }}"
          echo "discover-accounts: $DISCOVER_RESULT"
          echo "plan: $PLAN_RESULT"

          if [ "$DISCOVER_RESULT" = "failure" ] || [ "$PLAN_RESULT" = "failure" ]; then
            echo "❌ One or more accounts failed to plan — failing this required check."
            exit 1
          fi
          echo "✅ Every account that needed a plan produced one successfully."
