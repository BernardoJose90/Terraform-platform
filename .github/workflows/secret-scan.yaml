name: Secret Scan

# Scans for credentials committed by mistake — AWS keys, API tokens, private
# keys, Slack/webhook URLs, high-entropy strings — using gitleaks.
#
# This runs on EVERY file, not just Terraform: a secret can land in a script,
# a workflow, a README, a tfvars file. It is meant to be a REQUIRED check —
# a hit fails the job and blocks the merge. Both repos are public, so a
# leaked key is scraped and abused within minutes and stays in git history
# forever; catching it before merge is the whole point.
#
# Layers this is part of:
#   1. the `gitleaks` pre-commit hook  — blocks the commit on the dev's machine
#   2. this workflow                   — blocks the PR if pre-commit was skipped
#   3. GitHub push protection (a repo Setting, not code) — rejects the push
#      itself for provider-verifiable secrets. Enable it under
#      Settings → Code security → Secret scanning → Push protection.
#
# gitleaks-action is free for public repositories. If a repo is ever moved
# into a GitHub org as private, it needs a GITLEAKS_LICENSE secret.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: on a push to main the action diffs the pushed
          # commit range, which needs the parents present. On a PR it scans
          # the PR's own commits.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
