# Checkov configuration — the security scanner that runs on every PR.
#
# Every skip below is a risk we've deliberately decided to accept, with
# the reason for that decision written down — not a shortcut to make the
# build pass. soft_fail is turned off, so anything NOT listed here blocks
# the merge. Rule for adding something to this list: if you can't write a
# sentence explaining either why the finding doesn't really apply, or why
# the risk is okay to accept and what the real fix would eventually look
# like, then go fix the code instead of skipping the check.
#
# If a local scan and the CI scan disagree, trust CI — it downloads extra
# modules the local scan doesn't, so it checks more.

framework:
  - terraform

skip-check:
  # ───────────────────────────────────────────────────────────────────────────
  # Does not apply
  # ───────────────────────────────────────────────────────────────────────────

  # CKV_TF_1 — "Module sources should be pinned to a commit hash". Every
  # module here is a local path (e.g. ../../modules/vpc), not a remote
  # one — it's already versioned by the same git commit as whatever calls
  # it, so there's nothing to pin. This check is really meant for modules
  # pulled from a registry or a git URL. Doesn't apply here. 2 findings.
  - CKV_TF_1

  # CKV2_AWS_34 — "SSM parameters should be encrypted". The 5 flagged
  # parameters just hold IDs (TGW IDs, route table IDs, a RAM share ARN),
  # not secrets — knowing one of these IDs doesn't get you anything
  # without separate IAM permission to actually use it. Encrypting them
  # would mean setting up a KMS key with a cross-account policy grant, for
  # no real gain in confidentiality. Accepted. 5 findings.
  - CKV2_AWS_34

  # CKV_AWS_274 — "Don't let IAM roles/users use the AdministratorAccess
  # policy". This is flagging our deliberate emergency-access setup in IAM
  # Identity Center (security/sso.tf) — the tested way to recover if a CI
  # change accidentally locks the whole pipeline out. It's a named
  # permission set, only reachable through SSO, and every use of it shows
  # up in CloudTrail. Accepted. 1 finding.
  - CKV_AWS_274

  # ───────────────────────────────────────────────────────────────────────────
  # Real finding, accepted, with the production answer written down
  # ───────────────────────────────────────────────────────────────────────────

  # CKV_AWS_331 — "TGWs shouldn't auto-accept VPC attachment requests".
  # modules/tgw/main.tf does turn auto-accept on — this one's real.
  #
  # What limits the risk: the RAM share is set to reject anyone outside
  # our own AWS accounts, and names exactly two — production and
  # development, both of which are SUPPOSED to be attached anyway. So
  # this isn't "anyone in the org can attach", it's "the two accounts we
  # already expect can attach without an extra click".
  #
  # Why we haven't just turned it off: doing that properly needs a
  # separate "accept this attachment" step in the network account for
  # each spoke — but network's Terraform runs BEFORE the spokes', so at
  # that point there'd be nothing yet to accept. Fixing this for real is
  # a design change (either a second apply pass, or moving the accept
  # step somewhere else), not a quick setting flip, and it would break
  # how the current teardown/rebuild flow works today.
  #
  # The real fix, when we get to it: turn off auto-accept, have each
  # spoke publish its own attachment ID to SSM the same way the TGW ID
  # already is, and add a step in network that reads it and accepts it
  # explicitly — so accepting an attachment becomes something a human
  # reviews, not something that just happens automatically.
  #
  # Accepted for now. 1 finding.
  - CKV_AWS_331

  # ───────────────────────────────────────────────────────────────────────────
  # Real finding, accepted, tracked
  # ───────────────────────────────────────────────────────────────────────────
  #
  # The 8 checks below are all flagging the same one resource:
  #   modules/github-oidc-roles -> aws_iam_policy_document.permissions
  # (this is the permission policy for the TerraformDeploy role our CI
  # pipeline runs as).
  #
  # They're right to flag it — this is a genuine case of too much access,
  # not a false alarm. It grants nearly all of EC2 and a lot of IAM,
  # wide open, because a role that creates VPCs, Transit Gateways,
  # subnets, and instance profiles genuinely needs most of what EC2 can
  # do — and you can't lock permissions down to specific resource IDs
  # when the role's whole job is creating those IDs in the first place.
  #
  # What keeps this contained: each account has its own separate role,
  # not one shared role for everything; access to Terraform's state file
  # is limited to that account's own folder; and the role can only be
  # assumed by a GitHub Actions run coming from one of three specific
  # environments, restricted to the main branch, two of which require a
  # human to click approve first.
  #
  # The real fix, eventually: add a permissions boundary plus an
  # organization-level policy, so even if this role's own policy stays
  # broad, there's a hard outer limit it can never cross. Not built yet.
  # Tracked, not forgotten.
  - CKV_AWS_107  # credentials exposure
  - CKV_AWS_109  # permissions management without constraints
  - CKV_AWS_110  # privilege escalation
  - CKV_AWS_111  # write access without constraints
  - CKV_AWS_289  # permissions management without constraints
  - CKV_AWS_290  # write access without constraints
  - CKV_AWS_355  # "*" as a resource for restrictable actions
  - CKV_AWS_356  # "*" as a resource for restrictable actions

  # CKV_AWS_286 / CKV_AWS_287 — same idea, "privilege escalation" and
  # "credentials exposure", on the same resource as above. We checked
  # Checkov's own source code to confirm: this is the exact same
  # underlying detection as CKV_AWS_110/107 above, just registered under
  # two different IDs because Checkov scans this repo twice — once
  # reading the raw source code, once reading the resolved plan — and
  # each pass reports the finding under its own framework's ID. Not a
  # new or different risk, just the same one counted twice. Same
  # reasoning and same eventual fix as above. 4 findings.
  - CKV_AWS_286  # privilege escalation (terraform_plan framework)
  - CKV_AWS_287  # credentials exposure (terraform_plan framework)

  # CKV_AWS_61 — "IAM policy shouldn't allow assuming the role from any
  # service". Flags both the TerraformDeploy and TerraformPlan roles, in
  # every account.
  #
  # We checked Checkov's source to see exactly what trips this: it fails
  # whenever a trust policy's Allow statement lists an AWS account ID (or
  # that account's ":root") as who's allowed to assume the role. That's a
  # real, accurate match here — both roles' trust policies include a
  # break-glass statement that trusts the management account's root.
  #
  # What limits the risk: that statement also requires MFA to be active,
  # so simply being in the management account isn't enough on its own —
  # you'd still need explicit IAM permission to assume the role AND an
  # active MFA session. It's the same break-glass shape as CKV_AWS_274
  # above, just here it's for recovering a broken trust policy rather
  # than full account access.
  #
  # The real fix, eventually: point the break-glass trust at one specific
  # role in the management account instead of the whole account's root —
  # that role doesn't exist yet, so this is accepted for now. 2 findings
  # per account (one for each role).
  - CKV_AWS_61

  # ───────────────────────────────────────────────────────────────────────────
  # Tool limitation: count-expansion inside a nested external module
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Both of these are checks that build a graph of your resources and
  # trace connections between them — and both give the wrong answer here.
  # The tell: the exact same check PASSES for a resource that isn't
  # inside a "count" loop, but FAILS for the [0]/[1] versions of that
  # same resource. Checkov just can't follow the connection through a
  # counted resource sitting inside a module sitting inside another
  # module.
  #
  # CKV2_AWS_19 — "EIPs attached to a VPC should be attached to an EC2
  # instance". Flags the egress VPC's two NAT gateway IP addresses
  # ([0]/[1]) — which genuinely ARE attached, one per availability zone.
  # Production's own IP address, which isn't inside a count loop, passes
  # the identical check just fine.
  #
  # CKV2_AWS_12 — "Every VPC's default security group should block all
  # traffic". We checked this directly: the exact module version we're
  # pinned to (v6.6.1) already sets the default security group to allow
  # nothing, which is exactly what this check is asking for. Nothing in
  # our own code overrides that.
  #
  # Neither of these is an actual risk — they're skipped purely because
  # this particular kind of scan can't see far enough to confirm it. A
  # separate scan pass, later in the same pipeline, reads the fully
  # resolved plan instead of the raw source and gets both of these
  # right. If that pass is ever removed, these two skips need to go too.
  - CKV2_AWS_19
  - CKV2_AWS_12

  # CKV_AWS_338 — "CloudWatch log groups should keep logs for at least a
  # year". modules/vpc keeps flow logs for 90 days instead — a deliberate
  # balance between storage cost and how far back you'd actually need to
  # look for troubleshooting, given how much data flow logs generate.
  # Accepted.
  - CKV_AWS_338

  # CKV2_AWS_11 — "VPC flow logging should be enabled in every VPC". This
  # is the mirror image of the CKV2_AWS_19/12 tool limitation above: it
  # PASSES when scanning the raw source, but FAILS when scanning the
  # resolved plan, because Checkov's plan-based graph can't trace the
  # connection between the VPC and its flow log through two levels of
  # nested, counted modules. Flow logs really are on by default here.
  # Skipped because the source-code scan already covers this correctly.
  - CKV2_AWS_11

  # CKV2_AWS_35 — "The default route should go through a NAT gateway".
  # This one's a false alarm we accidentally introduced ourselves, with
  # the EVAL_TF_PLAN_AFTER_UNKNOWN=true setting in terraform-plan.yaml
  # (added to fix a different, real finding — CKV_AWS_158, about the
  # flow-log encryption key). Here's why: our routes never set
  # instance_id (we use nat_gateway_id/gateway_id instead), but AWS's own
  # provider still marks instance_id as "possibly set later" even when
  # it's never touched, so it shows up as unresolved in the plan. Our
  # setting change means Checkov now assumes anything unresolved WILL end
  # up with a real value — so it looks like an instance_id might be set,
  # when it never will be. We proved this by generating the plan both
  # with and without that setting: CKV_AWS_158 and CKV2_AWS_35 flip to
  # opposite results depending on which way it's set. There's no NAT
  # instance anywhere in this design — only NAT gateways.
  - CKV2_AWS_35
