# Checkov configuration.
#
# Baseline as of the last full accounting (2026-08-17): 263 passed, 4 failed
# in CI with external modules downloaded. All 4 are now covered below
# (CKV_AWS_286, CKV_AWS_287, CKV_AWS_61), so the next CI run should show 0
# failed — update this line with the real number once that run completes.
# (A local run without external-module download shows fewer of both; always
#  trust the CI number, it scans more.)
#
# Every skip below is an accepted risk with a stated reason, not a way to make
# the build green. `soft_fail` has been removed from the workflow, so anything
# NOT listed here fails the merge.
#
# Rule for adding to this file: if you cannot write a sentence explaining why
# the finding does not apply, or why the risk is accepted and what the
# production-grade answer would be, fix the code instead.

framework:
  - terraform

skip-check:
  # ───────────────────────────────────────────────────────────────────────────
  # Does not apply
  # ───────────────────────────────────────────────────────────────────────────

  # CKV_TF_1 — "Ensure Terraform module sources use a commit hash".
  # Every module here is a LOCAL path (../../modules/vpc). There is no remote
  # source to pin: the module is versioned by the same commit as its caller.
  # The check targets registry and git sources. False positive here. 2 findings.
  - CKV_TF_1

  # CKV2_AWS_34 — "AWS SSM Parameter should be Encrypted".
  # The 5 flagged parameters hold Transit Gateway IDs, TGW route table IDs and
  # a RAM share ARN, published by the network account for the spokes to read.
  # These are AWS resource identifiers, not secrets: knowing a tgw-id grants
  # nothing without IAM permission against it. Moving to SecureString would
  # require a customer-managed KMS key with a cross-account key policy grant to
  # every spoke, which is real operational surface for no confidentiality gain.
  # Accepted. 5 findings.
  - CKV2_AWS_34

  # CKV_AWS_274 — "Disallow IAM roles, users and groups from using the AWS
  # AdministratorAccess policy".
  # The flagged resource is the deliberate break-glass admin permission set in
  # IAM Identity Center (security/sso.tf). A landing zone needs exactly one
  # path to full access for account recovery, and this one is verified working:
  # it is the tested route for repairing a TerraformDeploy trust policy if a CI
  # change locks the pipeline out. Named permission set, assumed through SSO,
  # every use logged in CloudTrail. Accepted. 1 finding.
  - CKV_AWS_274

  # ───────────────────────────────────────────────────────────────────────────
  # Real finding, accepted, with the production answer written down
  # ───────────────────────────────────────────────────────────────────────────

  # CKV_AWS_331 — "Ensure Transit Gateways do not automatically accept VPC
  # attachment requests".
  #
  # modules/tgw/main.tf sets auto_accept_shared_attachments = "enable", so any
  # account the TGW is shared with can attach a VPC without an approval step.
  #
  # What bounds it here: the RAM share sets allow_external_principals = false
  # and names exactly two principals, the production and development account
  # IDs (member-accounts/network/main.tf, share_with_principals). So the set of
  # accounts that can auto-attach is two accounts I own, both of which are
  # supposed to be attached. It is not "anyone in the organisation".
  #
  # Why it is not simply turned off: disabling auto-accept requires an
  # aws_ec2_transit_gateway_vpc_attachment_accepter in the network account for
  # each spoke, and the apply order runs network BEFORE the spokes — so the
  # accepter would need an attachment that does not exist yet. Closing this
  # properly means either a second network apply pass or moving acceptance out
  # of the spoke apply entirely. That is a design change, not a config flag,
  # and it would break the networking_enabled teardown/rebuild flow as it
  # stands today.
  #
  # Production answer: disable auto-accept, publish each spoke's attachment ID
  # to SSM the way the TGW ID is published today, and add an accepter pass in
  # the network account that reads it. Then attachment acceptance becomes a
  # reviewed change rather than an automatic one.
  #
  # Accepted for now, deliberately, with the above written down. 1 finding.
  - CKV_AWS_331

  # ───────────────────────────────────────────────────────────────────────────
  # Real finding, accepted, tracked
  # ───────────────────────────────────────────────────────────────────────────
  #
  # The 8 checks below all fire on ONE resource:
  #   modules/github-oidc-roles -> aws_iam_policy_document.permissions
  # the TerraformDeploy role's permission policy.
  #
  # They are correct. That policy grants ec2:* on "*" and broad iam:* actions
  # on "*", because a Terraform role that provisions VPCs, Transit Gateways,
  # subnets and instance profiles genuinely needs most of EC2, and scoping IAM
  # actions by resource ARN is impossible when the role is what creates those
  # ARNs in the first place.
  #
  # This is a real over-privilege, not a false positive. Do not describe it as
  # one.
  #
  # What bounds it today:
  #   - one role per account, not one shared role
  #   - S3 state access scoped to that account's own key prefix
  #   - the trust policy only accepts an OIDC subject naming one of three
  #     GitHub Environments, each of which is restricted to the main branch and
  #     two of which require a human reviewer
  #
  # Production answer: an IAM permissions boundary on the role plus an SCP
  # denying anything outside the expected service set, so the role cannot
  # exceed the boundary even if its inline policy stays broad.
  #
  # Not built yet. Tracked, not forgotten.
  - CKV_AWS_107  # credentials exposure
  - CKV_AWS_109  # permissions management without constraints
  - CKV_AWS_110  # privilege escalation
  - CKV_AWS_111  # write access without constraints
  - CKV_AWS_289  # permissions management without constraints
  - CKV_AWS_290  # write access without constraints
  - CKV_AWS_355  # "*" as a resource for restrictable actions
  - CKV_AWS_356  # "*" as a resource for restrictable actions

  # CKV_AWS_286 / CKV_AWS_287 — "Ensure IAM policies does not allow privilege
  # escalation" / "...credentials exposure". Same titles, same resource
  # (aws_iam_role_policy.terraform_deploy_policy in github-oidc-roles), same
  # underlying cloudsplaining detection as CKV_AWS_110/CKV_AWS_107 above —
  # verified against Checkov's own source: both pairs call the identical
  # cloudsplaining scanner, just registered under different check IDs for the
  # "terraform_plan" (resolved-plan) framework vs. the "terraform" (source)
  # framework. The source-mode scan (bridgecrewio/checkov-action, "Checkov
  # Security Scan - All Accounts" job) only ever surfaces 107/110; the
  # resolved-plan scan (terraform-plan.yaml's "Checkov policy scan (resolved
  # plan)" step, framework: terraform_plan) surfaces 286/287 instead for the
  # exact same finding. Not a new risk, not a false positive — it is the
  # CKV_AWS_107/110 finding above, seen twice because two scan passes cover
  # the same resource. Same acceptance, same production answer (permissions
  # boundary + SCP, not built yet). 4 findings (2 accounts x 2 checks would
  # be more; in practice this fires once per account per check).
  - CKV_AWS_286  # privilege escalation (terraform_plan framework)
  - CKV_AWS_287  # credentials exposure (terraform_plan framework)

  # CKV_AWS_61 — "Ensure AWS IAM policy does not allow assume role permission
  # across all services". Fires on aws_iam_role.terraform_deploy and
  # aws_iam_role.terraform_plan in github-oidc-roles (main.tf:259-275 and
  # 327-341), on every account, every time.
  #
  # Verified against Checkov's own source (IAMRoleAllowAssumeFromAccount.py):
  # this check fails specifically when an Allow statement's Principal.AWS
  # matches a 12-digit account ID or an "arn:aws:iam::<account>:root" ARN. The
  # trigger is the ManagementAccountBreakGlass statement both trust policies
  # share, which trusts arn:aws:iam::${var.management_account_id}:root. That
  # is a real match, not a tool bug or a misparse of the OIDC/Federated
  # statement sitting next to it.
  #
  # What bounds it: the statement is gated by a condition requiring
  # aws:MultiFactorAuthPresent = true, so trusting account-root does not by
  # itself let anyone in the management account assume the role — they still
  # need their own IAM permission to assume it AND a live MFA session. This is
  # the same break-glass shape already accepted for CKV_AWS_274 above (one
  # deliberate full-access recovery path, gated, logged in CloudTrail): here
  # it is the recovery path for a TerraformDeploy/TerraformPlan trust policy
  # itself getting misconfigured and locking CI out, not for account admin.
  #
  # Production answer: scope the break-glass principal to a specific role in
  # the management account (e.g. a dedicated BreakGlassOperator role) instead
  # of :root, so the check passes on the ARN shape without weakening the MFA
  # gate. Not done yet because that role does not exist in the management
  # account today. Accepted for now. 2 findings (one per role, every account).
  - CKV_AWS_61

  # ───────────────────────────────────────────────────────────────────────────
  # Tool limitation: count-expansion inside a nested external module
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Both checks below are graph checks. Both fail on resources that carry a
  # count index inside terraform-aws-modules/terraform-aws-vpc, and both are
  # wrong. The tell is in the CI output itself: the SAME check PASSES for the
  # un-indexed instance and FAILS for the [0]/[1] instances of the identical
  # resource. Checkov's source-mode graph cannot follow an edge through count
  # expansion in a nested module, so it sees an orphan.
  #
  # CKV2_AWS_19 — "Ensure that all EIP addresses allocated to a VPC are attached
  # to EC2 instances". Fails on module.egress_vpc.module.vpc.aws_eip.nat[0] and
  # [1]. These are NAT gateway EIPs and they are attached, to the two NAT
  # gateways the egress VPC creates one per AZ. The production VPC's single,
  # un-indexed aws_eip.nat PASSES the same check.
  #
  # CKV2_AWS_12 — "Ensure the default security group of every VPC restricts all
  # traffic". Verified false at source: at the pinned commit (v6.6.1) the module
  # defaults manage_default_security_group = true with
  # default_security_group_ingress = [] and default_security_group_egress = [],
  # so aws_default_security_group.this[0] is created with zero rules. That is
  # exactly what this check asks for. Our wrapper in modules/vpc/main.tf does
  # not override any of those three, so the defaults apply.
  #
  # Neither is skipped because the risk is accepted. Both are skipped because
  # the SOURCE scan cannot resolve them. The plan-JSON scan in terraform-plan's
  # plan job reads fully expanded resources, so it evaluates both correctly and
  # is the pass that actually covers this ground. If you ever remove that pass,
  # remove these two skips and deal with the noise.
  - CKV2_AWS_19
  - CKV2_AWS_12

  # CKV_AWS_338 — "Ensure CloudWatch log groups retains logs for at least 1 year".
  # modules/vpc sets flow_log_cloudwatch_log_group_retention_in_days = 90. Accepted:
  # 90 days balances CloudWatch storage cost against the troubleshooting/audit window
  # for flow logs, which are high-volume. (Previously skipped under CKV2_AWS_338, which
  # is not a real check ID — that skip was a no-op. Fixed to the real ID, CKV_AWS_338.)
  - CKV_AWS_338

  # CKV2_AWS_11 — "Ensure VPC flow logging is enabled in all VPCs". Same tool
  # limitation as CKV2_AWS_19/CKV2_AWS_12 above, just the mirror image: it PASSES
  # under the source scan (verified: `checkov -d modules/vpc --check CKV2_AWS_11`
  # passes cleanly) but FAILS under the terraform_plan (resolved-plan) scan on
  # module.egress_vpc[0].module.vpc.aws_vpc.this[0] — Checkov's plan-based graph
  # can't trace the aws_vpc -> aws_flow_log connection through a module-count x
  # resource-count nesting two levels deep. Flow logs are genuinely enabled
  # (modules/vpc defaults enable_flow_log = true). Skipped because the SOURCE
  # scan is the pass that actually covers this ground, same logic as above.
  - CKV2_AWS_11

  # CKV2_AWS_35 — "AWS NAT Gateways should be utilized for the default route".
  # False positive introduced by our own EVAL_TF_PLAN_AFTER_UNKNOWN=true fix
  # (terraform-plan.yaml, added to resolve CKV_AWS_158 on the new flow-log KMS
  # key). aws_route's instance_id is never set — we route via nat_gateway_id /
  # gateway_id instead — but the provider schema marks instance_id as
  # computed-if-unset, so it shows up in the plan's after_unknown too. Before
  # our fix, Checkov read that as "attribute absent" and passed correctly.
  # After it, Checkov treats every after_unknown attribute as "will get a real
  # value", so instance_id looks set when it never will be. Verified by
  # reproducing both real terraform_plan JSONs locally, with and without the
  # env var flag, against modules/vpc: CKV_AWS_158 flips fail->pass and
  # CKV2_AWS_35 flips pass->fail at the same time. Accepted trade-off — see
  # main.tf and variables.tf for the actual NAT/IGW route resources; there is
  # no NAT instance anywhere in this VPC design.
  - CKV2_AWS_35
