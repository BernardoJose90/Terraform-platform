# Default StorageClass for EBS-backed PersistentVolumeClaims.
# Needs the aws-ebs-csi-driver add-on (modules/eks, enable_ebs_csi_driver).
#
# WaitForFirstConsumer: the volume is created in whichever AZ the pod is
# scheduled to, instead of a random AZ the pod then can't follow.
# encrypted without kmsKeyId: uses the AWS-managed aws/ebs key.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
