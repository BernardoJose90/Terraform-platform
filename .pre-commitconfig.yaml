# Local guardrails. Runs on `git commit`, before anything reaches CI.
#
# Why this exists: every check below already runs in the pipeline, but there it
# costs a push, a runner, and a wait. Here it costs about two seconds. The
# pipeline is the gate; this is the fast feedback loop.
#
# The terraform_fmt hook matters most right now. terraform-plan.yaml no longer
# auto-formats and commits for you (that deadlocked branch protection); it fails
# the PR instead. This hook formats on commit so that never happens.
#
# Install once, per clone:
#   brew install pre-commit terraform-docs   # macOS
#   pre-commit install
#
# Run against everything on demand:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      # Catches a broken workflow file before it costs you a push and a failed
      # run. Every workflow in this repo has been hand-edited repeatedly.
      - id: check-yaml
        args: [--allow-multiple-documents]
      # Terraform state and plan files must never be committed. .gitignore
      # already covers them; this is the second lock.
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      # Same command terraform-apply.yaml's quick-validate runs. If this passes
      # locally, that job cannot fail.
      - id: terraform_fmt

      # Catches HCL that does not parse or references something undefined,
      # without needing AWS credentials or a backend.
      - id: terraform_validate
        args:
          - --init-args=-backend=false
        exclude: ^modules/  # modules are validated through their callers

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: '3.3.11'
    hooks:
      - id: checkov
        # Same config file the pipeline uses, so a local pass and a CI pass mean
        # the same thing. One list of accepted findings, one place to edit it.
        args:
          - --config-file
          - .checkov.yaml
          - --framework
          - terraform
          - --compact
          - --quiet
        # Only the member accounts, matching `directory: member-accounts/` in
        # terraform-plan.yaml. Modules get scanned through their callers.
        files: ^member-accounts/.*\.tf$
